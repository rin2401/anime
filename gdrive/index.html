<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Drive</title>
    <link rel="apple-touch-icon" href="/anime/image/r3_512.png">
    <link rel="icon" type="image/png" href="/anime/image/r3_512.png">
    <meta property="og:image" content="/anime/image/r3.png">

    <link rel="preconnect" href="https://drive.google.com">
    <link rel="preconnect" href="https://r3fire.firebaseio.com">

    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            /* svh, KHÔNG phải dvh: trên iOS Chrome dvh == lvh (vd 828px) trong khi vùng
               layout thật chỉ 720px -> cao vượt 108px và overflow:hidden không cho kéo tới.
               svh luôn là trường hợp toolbar đang hiện (nhỏ nhất) nên chắc chắn vừa. */
            height: 100svh;
        }

        /* layout: video fills screen; optional episode sidebar on the right */
        #stage {
            display: flex;
            width: 100vw;
            height: 100vh;
            height: 100svh;
        }

        #frame-wrap {
            flex: 1 1 auto;
            position: relative;
            min-width: 0;
        }

        #gd-iframe {
            border: none;
            width: 100%;
            height: 100%;
            display: block;
        }

        /* episode list (only shown in playlist mode) */
        #episodes {
            flex: 0 0 240px;
            height: 100%;
            overflow-y: auto;
            /* relative: để offsetTop của .ep-item đo theo container cuộn này */
            position: relative;
            background: #111;
            border-left: 1px solid #222;
            display: none;
        }

        body.has-playlist #episodes {
            display: block;
        }

        #ep-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 12px 14px;
            font-size: 14px;
            font-weight: 700;
            color: #ddd;
            border-bottom: 1px solid #222;
            position: sticky;
            top: 0;
            background: #111;
        }

        #auto-next-lb {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            font-weight: 400;
            color: #999;
            white-space: nowrap;
            cursor: pointer;
        }

        #auto-next-cb {
            margin: 0;
        }

        .ep-item {
            display: block;
            width: 100%;
            text-align: left;
            box-sizing: border-box;
            padding: 10px 14px;
            background: none;
            border: none;
            border-bottom: 1px solid #1c1c1c;
            color: #ccc;
            font-size: 13px;
            cursor: pointer;
        }

        .ep-item:hover {
            background: #1d1d1d;
        }

        .ep-item.active {
            background: #2563eb;
            color: #fff;
            font-weight: 700;
        }

        /* Mobile: xếp dọc - video trên, danh sách tập full-width bên dưới (cuộn) */
        @media (max-width: 768px) {
            #stage {
                flex-direction: column;
            }

            /* Chỉ bó chiều cao khi CÓ danh sách tập; video đơn lẻ vẫn chiếm hết màn hình.
               65svh thay vì 16:9 cứng (~233px): player của Drive quá thấp thì control bar
               của nó đè lên native controls của iOS, chặn tap -> không bấm fullscreen được. */
            body.has-playlist #frame-wrap {
                flex: 0 0 auto;
                width: 100%;
                height: 65vh;
                height: 65svh;
            }

            body.has-playlist #episodes {
                flex: 1 1 auto;
                width: 100%;
                height: auto;
                min-height: 0;
                border-left: none;
                border-top: 1px solid #222;
            }

            .ep-item {
                padding: 13px 16px;
                font-size: 14px;
            }
        }

        /* Nút của riêng ta, đặt góc trên TRÁI: Drive chiếm góc trên phải (pop-out)
           và đáy (control bar) nên trái là chỗ duy nhất không đụng. */
        #vid-tools {
            position: absolute;
            top: 8px;
            left: 8px;
            z-index: 10;
            display: flex;
            gap: 6px;
        }

        #fs-btn,
        #drive-btn,
        #next-btn {
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            border: none;
            border-radius: 8px;
            background: rgba(0, 0, 0, .55);
            color: #fff;
            font-size: 17px;
            line-height: 1;
            cursor: pointer;
            text-decoration: none;
            -webkit-tap-highlight-color: transparent;
        }

        #fs-btn {
            width: 40px;
        }

        /* iPhone không có Fullscreen API, fullscreen thật chỉ có ở app Drive (phát native) */
        #drive-btn,
        #next-btn {
            padding: 0 12px;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
        }

        /* chỉ hiện khi đang ở chế độ playlist và còn tập sau */
        #next-btn {
            display: none;
        }

        body.has-next #next-btn {
            display: flex;
        }

        #fs-btn:active,
        #drive-btn:active,
        #next-btn:active {
            background: rgba(0, 0, 0, .85);
        }

        /* Toast "chuyển tập": đặt dưới #vid-tools, vẫn ở lề TRÁI vì Drive chiếm
           góc trên phải (pop-out) và cả dải đáy (control bar). */
        #next-toast {
            position: absolute;
            top: 56px;
            left: 8px;
            z-index: 11;
            display: none;
            align-items: center;
            gap: 10px;
            max-width: calc(100% - 16px);
            box-sizing: border-box;
            padding: 10px 12px;
            border-radius: 10px;
            background: rgba(0, 0, 0, .85);
            font-size: 13px;
            color: #eee;
        }

        body.show-next #next-toast {
            display: flex;
        }

        #next-toast b {
            color: #fff;
        }

        #next-toast button {
            border: none;
            border-radius: 6px;
            padding: 7px 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        #nt-go {
            background: #2563eb;
            color: #fff;
        }

        #nt-stay {
            background: #333;
            color: #ddd;
        }

        /* Chế độ toàn màn hình: ẩn danh sách, video chiếm hết viewport.
           Phải đặt SAU media query mobile để thắng body.has-playlist #frame-wrap. */
        body.fs #episodes {
            display: none;
        }

        body.fs #frame-wrap {
            flex: 1 1 auto;
            height: 100vh;
            height: 100svh;
        }

        /* messages / errors */
        #msg {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            box-sizing: border-box;
            font-size: 15px;
            line-height: 1.6;
            color: #eee;
        }

        #msg a {
            color: #60a5fa;
        }

        #msg code {
            background: #222;
            padding: 2px 6px;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <div id="stage">
        <div id="frame-wrap">
            <iframe id="gd-iframe" allowfullscreen="true"
                allow="autoplay; encrypted-media; fullscreen; picture-in-picture"></iframe>
            <div id="vid-tools">
                <button id="fs-btn" type="button" aria-label="Toàn màn hình" title="Toàn màn hình">⛶</button>
                <a id="drive-btn" target="_blank" rel="noopener"
                    title="Mở trong app Google Drive — fullscreen thật trên iPhone">Drive ↗</a>
                <button id="next-btn" type="button" title="Tập sau">Tập sau ›</button>
            </div>
            <div id="next-toast">
                <span id="nt-text"></span>
                <button id="nt-go" type="button">Chuyển ngay</button>
                <button id="nt-stay" type="button">Ở lại</button>
            </div>
        </div>
        <div id="episodes">
            <div id="ep-title">
                <span id="ep-title-text">Danh sách tập</span>
                <label id="auto-next-lb" title="Hết tập thì tự chuyển sang tập sau (ước lượng theo thời lượng)">
                    <input type="checkbox" id="auto-next-cb"> Tự chuyển
                </label>
            </div>
            <div id="ep-list"></div>
        </div>
    </div>

    <div id="msg"></div>

    <script>
        const FIREBASE_BASE = "https://r3fire.firebaseio.com/anime";
        const ANILIST_API = "https://graphql.anilist.co";
        const ARTWORK = "/anime/image/r3_512.png";

        const iframe = document.getElementById('gd-iframe');
        const msgEl = document.getElementById('msg');
        const epListEl = document.getElementById('ep-list');
        const epTitleEl = document.getElementById('ep-title-text');
        const epBoxEl = document.getElementById('episodes');   // container cuộn
        const fsBtn = document.getElementById('fs-btn');
        const driveBtn = document.getElementById('drive-btn');
        const nextBtn = document.getElementById('next-btn');
        const stageEl = document.getElementById('stage');
        const autoCb = document.getElementById('auto-next-cb');
        const ntText = document.getElementById('nt-text');

        // Cuộn danh sách tới tập đang xem — gán scrollTop trực tiếp trên #episodes.
        // KHÔNG dùng scrollIntoView: nó cuộn cả root viewport, trên iOS sẽ đẩy video
        // khỏi màn hình và html/body overflow:hidden không cho kéo lại.
        function centerActive() {
            const act = epListEl.querySelector('.ep-item.active');
            if (!act) return;
            requestAnimationFrame(() => {
                epBoxEl.scrollTop = act.offsetTop -
                    (epBoxEl.clientHeight - act.offsetHeight) / 2;
            });
        }

        function setFs(on) {
            document.body.classList.toggle('fs', on);
            fsBtn.textContent = on ? '✕' : '⛶';
            const label = on ? 'Thoát toàn màn hình' : 'Toàn màn hình';
            fsBtn.setAttribute('aria-label', label);
            fsBtn.title = label;
            // display:none làm mất scrollTop của #episodes -> canh lại khi thoát
            if (!on) centerActive();
        }

        // Fullscreen API chỉ có ở desktop/iPad/Android. iPhone KHÔNG hỗ trợ (đã đo trên máy
        // thật: document.fullscreenEnabled = false) nên ở đó chỉ giãn được bằng CSS; muốn
        // fullscreen thật trên iPhone phải qua app Drive (nút "Drive ↗" phát native).
        fsBtn.addEventListener('click', () => {
            const on = !document.body.classList.contains('fs');
            setFs(on);
            if (on) {
                if (document.fullscreenEnabled && stageEl.requestFullscreen) {
                    stageEl.requestFullscreen().catch(() => { });
                }
            } else if (document.fullscreenElement) {
                document.exitFullscreen().catch(() => { });
            }
        });

        // thoát fullscreen bằng Esc / gesture -> đồng bộ lại UI
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement && document.body.classList.contains('fs')) setFs(false);
        });

        function showError(html) {
            msgEl.innerHTML = html;
            msgEl.style.display = 'flex';
        }

        function hideError() {
            msgEl.style.display = 'none';
        }

        // Extract a Drive file id from a full link or a raw id.
        function parseDriveId(ref) {
            if (!ref) return null;
            ref = String(ref).trim();
            let m = ref.match(/\/d\/([\w-]+)/);          // .../file/d/<ID>/view
            if (m) return m[1];
            m = ref.match(/[?&]id=([\w-]+)/);            // ...open?id=<ID> | uc?id=<ID>
            if (m) return m[1];
            if (/^[\w-]{20,}$/.test(ref)) return ref;    // raw id
            return null;
        }

        function play(driveRef, title) {
            const fid = parseDriveId(driveRef);
            if (!fid) {
                showError('Không tách được Google Drive file ID từ:<br><code>' +
                    String(driveRef || '').replace(/</g, '&lt;') + '</code>');
                return;
            }
            hideError();
            iframe.src = `https://drive.google.com/file/d/${fid}/preview`;
            // /view mở app Drive nếu máy có cài -> phát native, có fullscreen thật
            driveBtn.href = `https://drive.google.com/file/d/${fid}/view`;
            if (title) {
                document.title = title;
                if ('mediaSession' in navigator) {
                    navigator.mediaSession.metadata = new MediaMetadata({
                        title: title,
                        artwork: [{ src: ARTWORK, sizes: '512x512', type: 'image/png' }]
                    });
                }
            }
        }

        // ---- Playlist mode (Firebase) ----
        // Ref để phát 1 tập: playlist Firebase luôn có drive_id; fallback file dành cho
        // chế độ ?list= (tập dựng từ tham số URL, chỉ có file).
        function episodeRef(ep) {
            return ep && (ep.drive_id || ep.file);
        }

        // Lọc playlist Firebase: chỉ nhận tập CÓ drive_id. Cùng một node còn chứa tập
        // chỉ có m3u8 (do crawler artplayer đẩy lên) — player Drive không phát được.
        function isDriveSource(ep) {
            return !!(ep && ep.drive_id);
        }

        // ---- Playlist state + tự chuyển tập ----
        // KHÔNG bắt được sự kiện "hết video": iframe drive.google.com/.../preview là
        // cross-origin và Drive không có postMessage API -> không đọc được currentTime.
        // Nên chỉ ƯỚC LƯỢNG: hẹn giờ theo thời lượng 1 tập (AniList) rồi hỏi lại user
        // bằng toast đếm ngược, thay vì nhảy tập trong khi họ đang pause.
        const DEFAULT_EP_SEC = 24 * 60;   // fallback khi AniList không có duration
        const GRACE_SEC = 90;             // bù buffering / user pause vài nhịp
        const COUNTDOWN_SEC = 20;         // thời gian toast đếm ngược trước khi chuyển
        const AUTO_KEY = 'gdrive:autonext';

        let epList = [];        // danh sách tập đang hiển thị
        let epButtons = [];
        let curIdx = -1;
        let epStoreKey = '';
        let epDurationSec = 0;  // 0 = chưa biết -> dùng DEFAULT_EP_SEC
        let waitTimer = null, tickTimer = null;

        let autoNext = localStorage.getItem(AUTO_KEY) !== '0';
        autoCb.checked = autoNext;
        autoCb.addEventListener('change', () => {
            autoNext = autoCb.checked;
            localStorage.setItem(AUTO_KEY, autoNext ? '1' : '0');
            scheduleAutoNext();
        });

        // Ghi tập đang xem vào URL (?ep=<số tập>) để link chia sẻ / F5 giữ nguyên tập.
        function syncUrl(epId) {
            if (!window.history || !history.replaceState) return;
            const p = new URLSearchParams(window.location.search);
            p.delete('e');                       // tham số cũ, thay bằng ep
            p.set('ep', String(epId));
            history.replaceState(null, '',
                window.location.pathname + '?' + p.toString() + window.location.hash);
        }

        function hideToast() {
            document.body.classList.remove('show-next');
            if (tickTimer) { clearInterval(tickTimer); tickTimer = null; }
        }

        function clearAutoNext() {
            if (waitTimer) { clearTimeout(waitTimer); waitTimer = null; }
            hideToast();
        }

        function scheduleAutoNext() {
            clearAutoNext();
            if (!autoNext || curIdx < 0 || curIdx >= epList.length - 1) return;
            const wait = ((epDurationSec || DEFAULT_EP_SEC) + GRACE_SEC) * 1000;
            waitTimer = setTimeout(showToast, wait);
        }

        function showToast() {
            const nx = epList[curIdx + 1];
            if (!nx) return;
            const name = nx.title || ('Tập ' + nx.id);
            let left = COUNTDOWN_SEC;
            const paint = () => {
                ntText.innerHTML = 'Tiếp: <b>' + name.replace(/</g, '&lt;') +
                    '</b> sau ' + left + 's';
            };
            paint();
            document.body.classList.add('show-next');
            tickTimer = setInterval(() => {
                left--;
                if (left <= 0) { hideToast(); selectEpisode(curIdx + 1); return; }
                paint();
            }, 1000);
        }

        document.getElementById('nt-go').addEventListener('click', () => {
            hideToast();
            selectEpisode(curIdx + 1);
        });
        // "Ở lại" = user vẫn đang xem tập này -> huỷ hẳn, không nhắc lại nữa
        document.getElementById('nt-stay').addEventListener('click', clearAutoNext);
        nextBtn.addEventListener('click', () => selectEpisode(curIdx + 1));

        function selectEpisode(idx) {
            const ep = epList[idx];
            if (!ep) return;
            curIdx = idx;
            epButtons.forEach((b, i) => b.classList.toggle('active', i === idx));
            if (epStoreKey) localStorage.setItem(epStoreKey, String(ep.id));
            syncUrl(ep.id);
            document.body.classList.toggle('has-next', idx < epList.length - 1);
            play(episodeRef(ep), ep.title);
            centerActive();
            scheduleAutoNext();
        }

        function renderEpisodes(storeKey, episodes, defaultEpId) {
            document.body.classList.add('has-playlist');
            epListEl.innerHTML = '';
            epList = episodes;
            epButtons = [];
            epStoreKey = storeKey;

            let targetId = defaultEpId || localStorage.getItem(storeKey);
            let targetIdx = episodes.findIndex(e => String(e.id) === String(targetId));
            // chưa xem tập nào -> chọn tập mới nhất (cuối danh sách, vì sort tăng dần)
            if (targetIdx < 0) targetIdx = episodes.length - 1;

            episodes.forEach((ep, idx) => {
                const btn = document.createElement('button');
                btn.className = 'ep-item';
                btn.textContent = ep.title || ('Tập ' + ep.id);
                btn.addEventListener('click', () => selectEpisode(idx));
                epListEl.appendChild(btn);
                epButtons.push(btn);
            });
            selectEpisode(targetIdx);
        }

        // Thời lượng 1 tập lấy từ AniList (id trên URL chính là AniList ID).
        function loadDuration(animeId) {
            if (!/^\d+$/.test(String(animeId))) return;
            fetch(ANILIST_API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    query: 'query($id:Int){Media(id:$id){duration}}',
                    variables: { id: parseInt(animeId, 10) }
                })
            })
                .then(r => r.json())
                .then(d => {
                    const mins = d && d.data && d.data.Media && d.data.Media.duration;
                    if (mins) { epDurationSec = mins * 60; scheduleAutoNext(); }
                })
                .catch(() => { });   // không có duration thì dùng mặc định 24'
        }

        function loadPlaylist(animeId, defaultEpId) {
            fetch(`${FIREBASE_BASE}/${animeId}.json`)
                .then(r => r.json())
                .then(data => {
                    if (!data) { showError('Không tìm thấy dữ liệu cho id <code>' + animeId + '</code>'); return; }
                    // Firebase node: array, hoặc object keyed theo số tập.
                    // Giữ key làm id khi value thiếu id (vd node chỉ có {drive_id}).
                    let entries = Array.isArray(data)
                        ? data.map((v, i) => [i, v])
                        : Object.entries(data);
                    let episodes = entries
                        .filter(([, v]) => v)
                        .map(([k, v]) => Object.assign({ id: (v.id != null ? v.id : k) }, v))
                        .filter(isDriveSource);
                    // sort tăng dần theo số tập (trên -> xuống)
                    episodes.sort((a, b) => (parseFloat(a.id) || 0) - (parseFloat(b.id) || 0));
                    if (!episodes.length) { showError('Playlist không có tập Drive cho id <code>' + animeId + '</code>'); return; }
                    epTitleEl.textContent = `Danh sách tập (${episodes.length})`;
                    renderEpisodes('gdrive:last:' + animeId, episodes, defaultEpId);
                    loadDuration(animeId);
                })
                .catch(err => {
                    console.error(err);
                    showError('Lỗi tải playlist: ' + err);
                });
        }

        // ---- List mode: ?list=ref1,ref2,...  (drive ids hoặc link, ngăn bởi dấu phẩy) ----
        // Tiêu đề tuỳ chọn: ?titles=<tên1>|<tên2>|... (URL-encoded, ngăn bởi dấu |)
        function loadList(listParam, titlesParam, defaultIdx) {
            const refs = listParam.split(',').map(s => s.trim()).filter(Boolean);
            if (!refs.length) { showError('Tham số <code>list</code> rỗng.'); return; }
            const titles = (titlesParam || '').split('|').map(s => s.trim());

            const episodes = refs.map((ref, i) => ({
                id: i + 1,                              // 1-based để ?ep=1 là video đầu
                title: titles[i] || ('Video ' + (i + 1)),
                file: ref
            }));

            epTitleEl.textContent = `Danh sách (${episodes.length})`;
            // storeKey theo nội dung list để mỗi list nhớ riêng tập đang xem
            const storeKey = 'gdrive:list:' + (refs.length + ':' + refs[0]);
            renderEpisodes(storeKey, episodes, defaultIdx);
        }

        // ---- Entry ----
        const params = new URLSearchParams(window.location.search);
        const v = params.get('v');
        const url = params.get('url');
        const id = params.get('id');         // Firebase anime id (playlist mode)
        // Tập cần mở: ?ep=<số tập>. `e` là tên cũ, giữ để link cũ không chết.
        const e = params.get('ep') || params.get('e');
        const list = params.get('list');     // danh sách drive id/link, cách nhau bằng dấu phẩy
        const titles = params.get('titles'); // tiêu đề tuỳ chọn, cách nhau bằng dấu |

        if (id) {
            loadPlaylist(id, e);
        } else if (list) {
            loadList(list, titles, e);
        } else if (v || url) {
            play(url || v);
        } else {
            showError(
                'Thiếu tham số. Dùng một trong:<br><br>' +
                '<code>?v=&lt;driveFileId&gt;</code><br>' +
                '<code>?url=&lt;link Google Drive&gt;</code><br>' +
                '<code>?list=&lt;id1,id2,id3&gt;</code> (playlist nhiều video)<br>' +
                '<code>?id=&lt;animeId&gt;</code> (playlist từ Firebase)<br>' +
                '<code>&amp;ep=&lt;số tập&gt;</code> (mở đúng tập, dùng kèm id/list)<br><br>' +
