<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Anime Room</title>
    <link rel="apple-touch-icon" href="/anime/image/r3_512.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Anime">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a1a1a">
    <link rel="manifest" href="/anime/manifest.json">
    <link rel="icon" type="image/png" href="/anime/image/r3_512.png">
    <meta property="og:image" content="/anime/image/r3.png">

    <style>
        /* Font đồng nhất với artplayer (stack PingFang/Roboto của player) —
           mọi thứ trong trang room kế thừa: chatbox, header, sảnh chờ */
        body {
            background-color: black;
            margin: 0;
            font-family: "PingFang SC", "Helvetica Neue", "Microsoft YaHei", Roboto, Arial, sans-serif;
        }

        /* ── Layout phòng: chat là SIDEBAR, không đè video ──
           Desktop (màn rộng): video co lại, chat thành cột bên phải.
           Mobile hẹp (<=900px): video 16:9 trên, chat dưới (kiểu YouTube
           live) — mọi lúc phim không bị che. Fullscreen thật: sidebar nằm
           ngoài cây fullscreen element nên tạm ẩn — chấp nhận, chat là phụ. */
        #room-layout {
            position: fixed;
            inset: 0;
            display: flex;
        }

        #video-area {
            flex: 1;
            min-width: 0;
            position: relative;
        }

        .artplayer-app {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        #chat-side {
            display: none;
            width: 300px;
            max-width: 40vw;
            flex-direction: column;
            background: #14161a;
            border-left: 1px solid rgba(255, 255, 255, 0.08);
        }

        #room-layout.chat-open #chat-side {
            display: flex;
        }

        #chat-panel {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }

        @media (max-width: 900px) {
            #room-layout {
                flex-direction: column;
            }

            /* video 16:9 tràn mép, trần 56vh để chat luôn có chỗ dưới nó */
            #video-area {
                flex: 0 0 auto;
                height: min(calc(100vw * 9 / 16), 56vh);
            }

            /* Chat ĐÓNG: video chiếm trọn màn hình (full như trang artplayer)
               — chat-side display:none nên flex:1 dồn hết chiều cao cho video */
            #room-layout:not(.chat-open) #video-area {
                flex: 1;
                height: auto;
            }

            .artplayer-app {
                position: relative;
                inset: auto;
            }

            #chat-side {
                width: 100%;
                max-width: none;
                flex: 1;
                border-left: 0;
                border-top: 1px solid rgba(255, 255, 255, 0.08);
            }
        }

        /* Header chatbox: mã phòng + tên đang phát (dời từ badge đè video —
           user muốn video sạch, thông tin phòng nằm trong chat) */
        #chat-head {
            display: flex;
            gap: 6px;
            align-items: baseline;
            padding: 9px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 12.5px;
            color: rgba(255, 255, 255, 0.75);
            flex: 0 0 auto;
        }

        #room-code {
            font-weight: 700;
            color: #23ade5;
            letter-spacing: 0.5px;
        }

        #room-label {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Nút chat nằm TRONG control bar artplayer (.art-control-chat) —
           icon SVG Material đồng bộ họ icon với các nút play/settings; bật
           chat thì icon xanh theme. CSS ở đây vì control do player.js thêm. */
        .art-control-chat.active svg {
            fill: #23ade5;
        }

        /* NGƯỜI XEM: khoá control phát từ phía player (class do player.js gắn
           khi xác định mình không phải host) — nút play, thanh tua, bấm giữa
           màn hình đều tê + mờ nhạt cho biết bị khoá. Volume/thời lượng/pip/
           fullscreen vẫn dùng vì là việc riêng từng máy. Lớp cưỡng chế hoàn
           tác event vẫn chạy ở player.js phòng khi webview cũ lơ is CSS. */
        #room-layout.viewer-lock .art-control-playAndPause,
        #room-layout.viewer-lock .art-progress {
            pointer-events: none;
            opacity: 0.45;
        }

        #room-layout.viewer-lock .art-state {
            pointer-events: none;
        }

        /* Người xem: khoá thêm nút setting (playbackRate làm lệch nhịp đồng
           bộ) + cụm playlist (đổi tập là quyền host). Các nút thao tác này
           ẨN HẲN khỏi control bar (display:none) thay vì mờ — người xem
           không cần thấy nút mình không bấm được; !important thắng style
           runtime artplayer. */
        #room-layout.viewer-lock .art-control-setting,
        #room-layout.viewer-lock .art-control-selector,
        #room-layout.viewer-lock .art-control-prev,
        #room-layout.viewer-lock .art-control-next {
            display: none !important;
        }

        /* Panel danh sách tập dạng lưới (copy từ trang artplayer): các tập là
           ô nút đều nhau 5 ô/hàng, neo phải không tràn mép player. !important
           thắng CSS artplayer chèn SAU <style> trang. */
        .art-control-selector .art-selector-list {
            display: grid !important;
            grid-template-columns: repeat(5, 1fr) !important;
            gap: 6px !important;
            width: 240px !important;
            padding: 8px !important;
            box-sizing: border-box !important;
            left: auto !important;
            right: 0 !important;
        }

        .art-control-selector .art-selector-list .art-selector-item {
            width: auto !important;
            min-width: 0 !important;
            padding: 5px 0 !important;
            margin: 0 !important;
            text-align: center !important;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }

        /* Tập đang phát: đổ nền màu theme + chữ trắng — mặc định artplayer chỉ
           đổi màu chữ thành xanh là quá mờ trên nền tối */
        .art-control-selector .art-selector-list .art-selector-item.art-current {
            background: #23ade5 !important;
            border-color: #23ade5 !important;
            color: #fff !important;
        }

        /* Sảnh chờ: gallery card phòng + nút tạo phòng (form bật modal) */
        #room-join {
            position: fixed;
            inset: 0;
            overflow: auto;
            background: #14161a;
            z-index: 40;
            display: none;
        }

        .lobby-wrap {
            max-width: 880px;
            margin: 0 auto;
            padding: 26px 16px 40px;
        }

        .lobby-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .lobby-title {
            font-size: 20px;
            font-weight: 700;
        }

        .lobby-sub {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.55);
            margin-top: 2px;
        }

        #create-btn {
            background: #23ade5;
            color: #fff;
            border: 0;
            border-radius: 10px;
            padding: 10px 18px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .lobby-joinrow {
            display: flex;
            gap: 8px;
            max-width: 380px;
        }

        #join-code, #pw-input {
            flex: 1;
            min-width: 0;
            background: #2b2f33;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 9px 12px;
            font-size: 14px;
            font-family: inherit;
            outline: 0;
            text-transform: lowercase;
        }

        #join-btn, #pw-btn {
            background: #23ade5;
            color: #fff;
            border: 0;
            border-radius: 8px;
            padding: 0 16px;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .room-list-title {
            margin: 20px 0 8px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: rgba(255, 255, 255, 0.55);
        }

        #room-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
        }

        .room-empty {
            grid-column: 1 / -1;
            padding: 18px 0;
            color: rgba(255, 255, 255, 0.5);
        }

        .room-card {
            background: #1b1e23;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
        }

        .room-card:hover {
            border-color: #23ade5;
        }

        .room-card-img {
            position: relative;
            aspect-ratio: 2 / 3;
            background: #0d0f12;
        }

        .room-card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .room-card-noimg {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
        }

        .room-card-lock {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.55);
            border-radius: 6px;
            padding: 3px 6px;
            font-size: 12px;
        }

        .room-card-body {
            padding: 8px 10px 10px;
        }

        .room-card-name {
            font-weight: 700;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .room-card-title {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.7);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        .room-card-meta {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.55);
        }

        .room-card-dot {
            flex: none;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #6b7280;
        }

        .room-card.live .room-card-dot {
            background: #23ade5;
        }

        .room-card-age {
            margin-left: auto;
        }

        /* Modal (tạo phòng / mật khẩu): đè lên mọi thứ, card tối cuộn được */
        .modal {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.65);
            z-index: 60;
            padding: 14px;
        }

        .modal.open {
            display: flex;
        }

        .modal-card {
            background: #1b1e23;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            width: min(600px, 94vw);
            max-height: 90vh;
            overflow: auto;
            padding: 16px 18px;
            font-size: 14px;
            line-height: 1.5;
            color: #fff;
        }

        .modal-card.modal-sm {
            width: min(360px, 94vw);
        }

        .modal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 12px;
        }

        .modal-x {
            background: none;
            border: 0;
            color: rgba(255, 255, 255, 0.6);
            font-size: 16px;
            cursor: pointer;
            padding: 4px 8px;
        }

        .modal-x:hover {
            color: #fff;
        }

        .pw-sub {
            margin: 0 0 10px;
            color: rgba(255, 255, 255, 0.65);
            font-size: 13px;
        }

        #pw-err {
            min-height: 1.2em;
            margin-top: 8px;
            color: #ff6b6b;
            font-size: 13px;
        }

        /* Form trong modal tạo phòng */
        #c-q {
            width: 100%;
            box-sizing: border-box;
            background: #2b2f33;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 11px 13px;
            font-family: inherit;
            font-size: 14px;
            outline: 0;
        }

        #c-auth {
            display: none;
            margin-bottom: 12px;
            padding: 10px 12px;
            border-radius: 10px;
            background: rgba(35, 173, 229, 0.12);
            border: 1px solid rgba(35, 173, 229, 0.35);
            font-size: 13px;
        }

        #c-auth a {
            color: #23ade5;
            font-weight: 700;
        }

        #c-results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
            gap: 10px;
            margin-top: 12px;
        }

        #c-results .card {
            cursor: pointer;
            border-radius: 8px;
            background: #23272d;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px;
            text-align: center;
        }

        #c-results .card img {
            width: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
            border-radius: 6px;
            display: block;
        }

        #c-results .card .name {
            font-size: 11.5px;
            margin-top: 5px;
            min-height: 2.8em;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        #c-results .card.picked {
            border-color: #23ade5;
        }

        #c-eps {
            margin-top: 14px;
        }

        #c-eps h3 {
            margin: 0 0 8px;
            font-size: 14px;
        }

        #c-ep-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }

        #c-ep-grid button {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            padding: 8px 0;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #c-ep-grid button:hover {
            border-color: #23ade5;
        }

        .c-form {
            margin-top: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        #c-name, #c-pw {
            background: #2b2f33;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 9px 12px;
            font-family: inherit;
            font-size: 14px;
            outline: 0;
        }

        .c-priv {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
        }

        #c-status {
            margin-top: 10px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            min-height: 1.2em;
        }

        @media (max-width: 480px) {
            #c-ep-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
    </style>

    <script defer src="https://cdn.jsdelivr.net/npm/artplayer@5.4.0/dist/artplayer.js"></script>
    <script defer src="/anime/player/mousetrap.min.js" charset="utf-8"></script>
    <script defer src="/anime/artplayer/artplayer-plugin-playlist.browser.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.0.0/firebase-auth-compat.js"></script>
    <!-- SDK database: đồng bộ room/chat realtime qua WebSocket (tự reconnect
         + resync) thay SSE + poll tay — phải đứng TRƯỚC auth.js/chat.js/... -->
    <script defer src="https://www.gstatic.com/firebasejs/10.0.0/firebase-database-compat.js"></script>
</head>

<body>
    <div id="room-layout">
        <div id="video-area">
            <div class="artplayer-app"></div>
        </div>
        <aside id="chat-side">
            <div id="chat-head"><span id="room-code"></span> <span id="room-label">Đang kết nối phòng…</span></div>
            <div id="chat-panel"></div>
        </aside>
    </div>

    <!-- Sảnh chờ khi không có ?id= mã phòng: gallery card + tạo phòng (modal) -->
    <div id="room-join">
        <div class="lobby-wrap">
            <div class="lobby-head">
                <div>
                    <div class="lobby-title">Phòng xem chung</div>
                    <div class="lobby-sub">Cùng xem đồng bộ với bạn bè — chủ phòng điều khiển phát</div>
                </div>
                <button id="create-btn" type="button">＋ Tạo phòng</button>
            </div>
            <div class="lobby-joinrow">
                <input id="join-code" placeholder="Mã phòng, vd dwjnqx" autocomplete="off">
                <button id="join-btn" type="button">Vào</button>
            </div>
            <div class="room-list-title">Phòng đang mở</div>
            <div id="room-list"></div>
        </div>
    </div>

    <!-- Modal tạo phòng: tìm phim → chọn tập → tên/mode/mật khẩu -->
    <div class="modal" id="create-modal">
        <div class="modal-card">
            <div class="modal-head"><span>Tạo phòng xem chung</span><button class="modal-x" type="button">✕</button></div>
            <div id="c-auth">Cần đăng nhập để tạo phòng. <a href="/anime/auth/">Đăng nhập →</a></div>
            <input id="c-q" type="search" placeholder="Tìm phim cho phòng…" autocomplete="off">
            <div id="c-results"></div>
            <div id="c-eps" style="display:none">
                <h3 id="c-eps-title"></h3>
                <div id="c-ep-grid"></div>
            </div>
            <div class="c-form">
                <input id="c-name" placeholder="Tên phòng (tuỳ chọn, vd: chill cuối tuần)" maxlength="40" autocomplete="off">
                <label class="c-priv"><input type="checkbox" id="c-priv"> Phòng riêng — người vào cần mật khẩu</label>
                <input id="c-pw" placeholder="Mật khẩu phòng" style="display:none" autocomplete="off">
            </div>
            <div id="c-status"></div>
        </div>
    </div>

    <!-- Modal mật khẩu: vào phòng riêng từ card (sảnh) hoặc từ link trực tiếp -->
    <div class="modal" id="pw-modal">
        <div class="modal-card modal-sm">
            <div class="modal-head"><span id="pw-title">Phòng riêng</span><button class="modal-x" type="button">✕</button></div>
            <p class="pw-sub">Phòng này cần mật khẩu để vào.</p>
            <div class="lobby-joinrow">
                <input id="pw-input" placeholder="Mật khẩu" autocomplete="off">
                <button id="pw-btn" type="button">Vào</button>
            </div>
            <div id="pw-err"></div>
        </div>
    </div>
    <!-- auth.js (khởi tạo firebase) phải đứng trước chat.js/lobby.js/player.js;
         cả bốn defer nên chạy đúng thứ tự -->
    <script defer src="/anime/auth/auth.js"></script>
    <script defer src="/anime/room/chat.js"></script>
    <script defer src="/anime/room/lobby.js"></script>
    <script defer src="/anime/room/player.js"></script>
</body>
