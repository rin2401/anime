<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Anime Room</title>
    <link rel="apple-touch-icon" href="/anime/image/r3_512.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Anime">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a1a1a">
    <link rel="manifest" href="/anime/manifest.json">
    <link rel="icon" type="image/png" href="/anime/image/r3_512.png">
    <meta property="og:image" content="/anime/image/r3.png">

    <style>
        body {
            background-color: black;
            margin: 0;
        }

        /* ── Layout phòng: chat là SIDEBAR, không đè video ──
           Desktop (màn rộng): video co lại, chat thành cột bên phải.
           Mobile hẹp (<=900px): video 16:9 trên, chat dưới (kiểu YouTube
           live) — mọi lúc phim không bị che. Fullscreen thật: sidebar nằm
           ngoài cây fullscreen element nên tạm ẩn — chấp nhận, chat là phụ. */
        #room-layout {
            position: fixed;
            inset: 0;
            display: flex;
        }

        #video-area {
            flex: 1;
            min-width: 0;
            position: relative;
        }

        .artplayer-app {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        #chat-side {
            display: none;
            width: 300px;
            max-width: 40vw;
            flex-direction: column;
            background: #14161a;
            border-left: 1px solid rgba(255, 255, 255, 0.08);
        }

        #room-layout.chat-open #chat-side {
            display: flex;
        }

        #chat-panel {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }

        @media (max-width: 900px) {
            #room-layout {
                flex-direction: column;
            }

            /* video 16:9 tràn mép, trần 56vh để chat luôn có chỗ dưới nó */
            #video-area {
                flex: 0 0 auto;
                height: min(calc(100vw * 9 / 16), 56vh);
            }

            .artplayer-app {
                position: relative;
                inset: auto;
            }

            #chat-side {
                width: 100%;
                max-width: none;
                flex: 1;
                border-left: 0;
                border-top: 1px solid rgba(255, 255, 255, 0.08);
            }
        }

        /* Badge góc trái trong vùng video: mã phòng + nhãn đang phát */
        #room-badge {
            position: absolute;
            left: 10px;
            bottom: 10px;
            max-width: 60%;
            padding: 6px 10px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            font: 13px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif;
            pointer-events: none;
            z-index: 10;
        }

        #room-code {
            font-weight: 700;
        }

        /* Nút 💬 góc phải trên: bật/tắt sidebar chat */
        #chat-toggle {
            position: fixed;
            top: calc(10px + env(safe-area-inset-top));
            right: 10px;
            width: 38px;
            height: 38px;
            border-radius: 19px;
            border: 0;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            z-index: 30;
        }

        #chat-toggle.active {
            background: #23ade5;
        }
    </style>

    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://r3fire.firebaseio.com">

    <script defer src="https://cdn.jsdelivr.net/npm/hls.js@1.6.16/dist/hls.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/artplayer@5.4.0/dist/artplayer.js"></script>
    <script defer src="/anime/player/mousetrap.min.js" charset="utf-8"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.0.0/firebase-auth-compat.js"></script>
</head>

<body>
    <div id="room-layout">
        <div id="video-area">
            <div class="artplayer-app"></div>
            <div id="room-badge"><span id="room-code"></span> <span id="room-label">Đang kết nối phòng…</span></div>
        </div>
        <aside id="chat-side"><div id="chat-panel"></div></aside>
    </div>
    <button id="chat-toggle" type="button" aria-label="Chat">💬</button>
    <!-- auth.js (khởi tạo firebase) phải đứng trước chat.js/player.js; cả ba defer
         nên chạy đúng thứ tự -->
    <script defer src="/anime/auth/auth.js"></script>
    <script defer src="/anime/room/chat.js"></script>
    <script defer src="/anime/room/player.js"></script>
</body>
