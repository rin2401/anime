<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Tạo phòng xem chung</title>
    <link rel="apple-touch-icon" href="/anime/image/r3_512.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Anime">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a1a1a">
    <link rel="manifest" href="/anime/manifest.json">
    <link rel="icon" type="image/png" href="/anime/image/r3_512.png">

    <style>
        :root {
            color-scheme: dark;
        }

        body {
            background-color: #14161a;
            color: #fff;
            margin: 0;
            min-height: 100vh;
            font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
        }

        header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: sticky;
            top: 0;
            background: #14161a;
            z-index: 10;
        }

        header a {
            display: flex;
        }

        header img {
            height: 32px;
        }

        header h1 {
            font-size: 17px;
            margin: 0;
            font-weight: 700;
        }

        main {
            max-width: 860px;
            margin: 0 auto;
            padding: 16px;
        }

        /* Form control nền tối cùng trang chủ (#2b2f33) */
        #q {
            width: 100%;
            box-sizing: border-box;
            background: #2b2f33;
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 12px 14px;
            font: 15px -apple-system, "Segoe UI", Roboto, sans-serif;
            outline: 0;
        }

        .hint {
            color: rgba(255, 255, 255, 0.55);
            font-size: 13px;
            margin: 8px 2px 0;
        }

        #my-room {
            margin: 14px 2px 0;
            padding: 10px 12px;
            border-radius: 10px;
            background: rgba(35, 173, 229, 0.12);
            border: 1px solid rgba(35, 173, 229, 0.35);
            font-size: 13px;
            display: none;
        }

        #my-room b {
            color: #23ade5;
            letter-spacing: 1px;
        }

        #auth-gate {
            display: none;
            margin: 18px 2px;
            padding: 16px;
            border-radius: 12px;
            background: #1b1e23;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        #auth-gate p {
            margin: 0 0 12px;
        }

        #auth-gate a {
            display: inline-block;
            background: #23ade5;
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            border-radius: 8px;
            padding: 9px 16px;
        }

        /* Grid kết quả tìm kiếm: card dọc kiểu trang chủ */
        #results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 12px;
            margin-top: 16px;
        }

        .card {
            cursor: pointer;
            border-radius: 10px;
            background: #1b1e23;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px;
            text-align: center;
        }

        .card img {
            width: 100%;
            aspect-ratio: 2 / 3;
            object-fit: cover;
            border-radius: 6px;
            display: block;
        }

        .card .name {
            font-size: 12.5px;
            margin-top: 6px;
            min-height: 2.9em;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .card.picked {
            border-color: #23ade5;
        }

        /* Grid chọn tập: chip vuông 5 ô mỗi hàng như panel playlist artplayer */
        #eps {
            display: none;
            margin-top: 18px;
        }

        #eps h3 {
            margin: 0 0 10px;
            font-size: 15px;
        }

        #ep-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }

        #ep-grid button {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            padding: 8px 0;
            font-size: 13px;
            cursor: pointer;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #ep-grid button:hover {
            border-color: #23ade5;
        }

        #status {
            margin: 14px 2px 0;
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            min-height: 1.2em;
        }

        @media (max-width: 480px) {
            #ep-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
    </style>

    <link rel="preconnect" href="https://docs.google.com">
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://r3fire.firebaseio.com">

    <script defer src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth-compat.js"></script>
    <script defer src="/anime/auth/auth.js"></script>
</head>

<body>
    <header>
        <a href="/anime" aria-label="Trang chủ"><img src="/anime/image/r3_player.png" alt="r3mina"></a>
        <h1>Tạo phòng xem chung</h1>
    </header>
    <main>
        <div id="auth-gate">
            <p>Đăng nhập để tạo phòng xem chung (chủ phòng điều khiển phát cho cả phòng).</p>
            <a href="/anime/auth/">Đăng nhập</a>
        </div>

        <input id="q" type="search" placeholder="Tìm phim cho phòng…" autocomplete="off">
        <div class="hint">Chọn bộ → chọn tập → phòng của bạn tự mở, gửi link cho bạn bè là cùng xem.</div>
        <div id="my-room">Phòng của bạn: <b id="my-code"></b> — chọn tập khác là phòng đổi theo (link giữ nguyên).</div>

        <div id="results"></div>

        <div id="eps">
            <h3 id="eps-title"></h3>
            <div id="ep-grid"></div>
        </div>

        <div id="status"></div>
    </main>

    <script>
        var RTDB = 'https://r3fire.firebaseio.com';
        var SHEET_ID = '12q04f4hwtVQjfVSUayDsgXLGGbqrl9urm8gp556nPQA';
        var SHEET_GID = "1193967919";
        var imageUrl = "/anime/image/r3_512.png";

        var rows = null;       // cache Sheet catalog
        var pickedRow = null;  // bộ đang chọn tập
        var pickedEps = [];    // danh sách tập của bộ đang chọn

        // ── Sheet catalog (bản published gviz — copy pattern trang chủ/artplayer,
        // không dùng regex lookbehind vì TV cũ SyntaxError ngay lúc parse) ──
        function fetchSheetRows() {
            var url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&tq&gid=${SHEET_GID}`;
            return fetch(url).then(res => res.text()).then(txt => {
                var jsonString = txt.substring(txt.indexOf('"table":') + '"table":'.length, txt.lastIndexOf('});'))
                var data = JSON.parse(jsonString)
                var cols = data.cols.map(col => col.label)
                return data.rows.map(r => {
                    var row = {}
                    cols.map((col, i) => {
                        var cel = r.c[i]
                        row[col] = cel ? (cel.f ? cel.f : cel.v) : ''
                    })
                    return row
                })
            })
        }

        // khớp tên bỏ dấu + lowercase (NFD) — TV cũ (Chrome 41+) vẫn chạy
        function normalizeText(s) {
            return String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
                .replace(/đ/g, "d");
        }

        // Số tập để sắp xếp: '7.5' -> 7.5, '07_5' -> 7.5 (key Firebase thay '.' bằng '_')
        function epNum(id) {
            return parseFloat(String(id).replace(/_/g, '.')) || 0;
        }

        // Nhãn tập: key Firebase thay '.' bằng '_', hậu tố END mọi biến thể hiện trần số
        function displayEp(id) {
            return String(id).replace(/_/g, '.').replace(/[\s._-]+end\s*$/i, '').trim();
        }

        // Map node Firebase anime/{pid} thành danh sách tập có url phát được
        // (copy mapEpisodes của artplayer: chỉ tập có file/m3u8, tập inline m3u8
        // trỏ về chính node qua customType json)
        function mapEpisodes(data, animeId) {
            var episodeList = [];
            data = data || {}
            Object.entries(data).forEach(([id, episode]) => {
                if (!episode) return
                if (!episode.file && !episode.m3u8) return
                var file = episode.file ||
                    `https://r3fire.firebaseio.com/anime/${animeId}/${id}.json`
                id = episode.id || id
                episodeList.push({
                    id: id,
                    title: episode.title,
                    url: file,
                });
            });
            episodeList.sort(function (a, b) { return epNum(a.id) - epNum(b.id) });
            return episodeList;
        }

        // kkphim: lấy số tập từ TÊN ('Tập 1004.5') — slug bỏ dấu chấm nên parse
        // slug sẽ sai các tập .5 (copy kkphimEpisodes của artplayer, rút gọn)
        function kkphimEpisodes(data) {
            var lastNum = 0, extra = 0;
            return (data.episodes[0].server_data || []).map((item) => {
                var slug = item.slug || ''
                var id = 1
                var nm = (item.name || '').match(/(\d+(?:\.\d+)?)/)
                if (nm) {
                    id = parseFloat(nm[1]); lastNum = id; extra = 0
                } else if (slug.indexOf("tap-") === 0) {
                    let rest = slug.slice(4);
                    let num = Number(rest);
                    if (Number.isInteger(num)) {
                        id = num; lastNum = num; extra = 0
                    } else {
                        id = lastNum + 0.5 + extra / 100; extra++
                    }
                }
                return { id: id, title: (data.movie && data.movie.origin_name) + " - " + id, url: item.link_m3u8 };
            });
        }

        // ── Tìm kiếm ──
        var qEl = document.getElementById('q');
        var resultsEl = document.getElementById('results');
        var epsEl = document.getElementById('eps');
        var epsTitle = document.getElementById('eps-title');
        var epGrid = document.getElementById('ep-grid');
        var statusEl = document.getElementById('status');
        var myRoomEl = document.getElementById('my-room');
        var myCodeEl = document.getElementById('my-code');
        var authGate = document.getElementById('auth-gate');

        function setStatus(s) { statusEl.textContent = s || ''; }

        function myCode() {
            try {
                var c = localStorage.getItem('room:hostcode') || '';
                return /^[a-z2-9]{6}$/.test(c) ? c : '';
            } catch (e) { return ''; }
        }

        function showMyRoom() {
            var c = myCode();
            if (!c) return;
            myCodeEl.textContent = c;
            myRoomEl.style.display = 'block';
        }

        function renderResults(list) {
            resultsEl.innerHTML = '';
            list.slice(0, 24).forEach(row => {
                var d = document.createElement('div');
                d.className = 'card';
                var img = document.createElement('img');
                img.loading = 'lazy';
                img.src = row.image || imageUrl;
                img.onerror = function () { this.src = imageUrl; };
                var name = document.createElement('div');
                name.className = 'name';
                name.textContent = row.name || '(không tên)';
                d.appendChild(img);
                d.appendChild(name);
                d.addEventListener('click', function () { pickRow(row, d); });
                resultsEl.appendChild(d);
            });
            if (!list.length) setStatus('Không tìm thấy bộ nào khớp.');
            else setStatus('');
        }

        function doSearch() {
            if (!rows) return;
            var nq = normalizeText(qEl.value).trim();
            if (!nq) { resultsEl.innerHTML = ''; return; }
            renderResults(rows.filter(r => r.name && normalizeText(r.name).indexOf(nq) !== -1));
        }

        var searchTimer = 0;
        qEl.addEventListener('input', function () {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(doSearch, 300);
        });

        // ── Chọn bộ -> tải danh sách tập ──
        // Ưu tiên nguồn như playerUrlFromRow của artplayer: playlist > anilist_id
        // > phimapi (kkphim) > gdrive — phimapi luôn có m3u8 trong khi node
        // Firebase theo gdrive có khi chỉ chứa drive_id (chưa crawl m3u8)
        function pickRow(row, cardEl) {
            [...resultsEl.children].forEach(c => c.classList.remove('picked'));
            if (cardEl) cardEl.classList.add('picked');
            pickedRow = row;
            var pid = row.playlist || row.anilist_id;
            var k = row.phimapi;
            if (!pid && !k) pid = row.gdrive;
            setStatus('Đang tải danh sách tập…');
            var p;
            if (pid) {
                p = fetch(RTDB + '/anime/' + pid + '.json').then(res => res.json())
                    .then(data => mapEpisodes(data, pid));
            } else if (k) {
                p = fetch('https://phimapi.com/phim/' + k).then(res => res.json())
                    .then(data => kkphimEpisodes(data));
            } else {
                p = Promise.resolve([]);
            }
            p.then(function (eps) {
                pickedEps = eps;
                epsTitle.textContent = (row.name || '') + ' — chọn tập:';
                epGrid.innerHTML = '';
                eps.forEach(function (ep) {
                    var b = document.createElement('button');
                    b.type = 'button';
                    b.textContent = displayEp(ep.id);
                    b.addEventListener('click', function () { createRoom(ep); });
                    epGrid.appendChild(b);
                });
                epsEl.style.display = eps.length ? 'block' : 'none';
                setStatus(eps.length ? '' : 'Bộ này chưa có nguồn phát (chưa crawl).');
            }).catch(function () { setStatus('Tải danh sách tập lỗi — thử lại.'); });
        }

        // ── Tạo / cập nhật phòng rồi vào thẳng trang room ──
        // Code tái dùng theo localStorage room:hostcode: link share ổn định,
        // chọn tập khác là CÙNG phòng đó đổi nguồn (người xem tự theo url mới).
        function createRoom(ep) {
            var u = (typeof firebase !== 'undefined' && firebase.auth) ? firebase.auth().currentUser : null;
            if (!u) {
                authGate.style.display = 'block';
                setStatus('');
                return;
            }
            if (!ep || !ep.url) return;
            var code = myCode();
            if (!code) {
                var chars = 'abcdefghjkmnpqrstuvwxyz23456789';
                for (var i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
            }
            var payload = {
                host: u.uid,
                created: Date.now(),
                url: ep.url,
                title: (pickedRow && pickedRow.name ? pickedRow.name + ' — Tập ' : 'Tập ') + displayEp(ep.id),
                pos: 0,
                playing: false,
                updatedAt: Date.now(),
            };
            setStatus('Đang tạo phòng…');
            u.getIdToken().then(function (tok) {
                return fetch(RTDB + '/room/' + code + '.json?auth=' + tok, {
                    method: 'PUT',
                    body: JSON.stringify(payload),
                });
            }).then(function (r) {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                try { localStorage.setItem('room:hostcode', code); } catch (e) { }
                window.location.href = '/anime/room/?id=' + code;
            }).catch(function (e) {
                setStatus('Tạo phòng lỗi: ' + e.message);
            });
        }

        // ── Khởi động ──
        document.addEventListener('DOMContentLoaded', function () {
            showMyRoom();
            fetchSheetRows().then(function (r) {
                rows = r;
                doSearch();
            }).catch(function () {
                setStatus('Không tải được danh mục phim — thử lại sau.');
            });
            if (typeof firebase !== 'undefined' && firebase.auth) {
                firebase.auth().onAuthStateChanged(function (u) {
                    authGate.style.display = (!u) ? 'block' : 'none';
                });
            }
        });
    </script>
</body>

</html>
