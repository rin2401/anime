    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a1a1a">

    <link rel="icon" type="image/png" href="/anime/image/r3_512.png">

    <link rel="preconnect" href="https://s4.anilist.co">

    <style>
        /* Trang nền tối: khai báo color-scheme để UA dark mode không ép đảo
           màu form control (select/input) — nền tối chữ tối đọc không ra */
        :root {
            color-scheme: dark;
        }

        /* Thay Bootstrap: cả trang chỉ dùng form-select/form-control nên tự viết cho nhẹ.
           Nền tối chữ trắng khớp theme #1a1a1a — kể cả UA dark mode cũng đọc rõ. */
        .form-select,
        .form-control {
            box-sizing: border-box;
            padding: 6px 12px;
            font-size: 16px;
            font-family: inherit;
            line-height: 1.5;
            color: #ffffff;
            background-color: #2b2f33;
            border: 1px solid #6c757d;
            border-radius: 6px;
        }

        /* engine cũ (TV) không ăn color-scheme: tô luôn option trong popup */
        .form-select option,
        .form-control option {
            color: #ffffff;
            background-color: #2b2f33;
        }

        .form-control::placeholder {
            color: #9aa3ab;
        }

        .form-select:focus,
        .form-control:focus,
        .search-btn:focus {
            outline: 2px solid #60a5fa;
        }

        body {
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            display: flex;
            flex-direction: column;
            /* justify-content: center; */
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        #filter-container {
            margin: 20px;
            display: none;
            gap: 10px;
        }

        .image-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* tiêu đề section kết quả search ("Từ Sheet" / "Từ kkphim"):
           flex-basis 100% chiếm trọn 1 hàng trong flex-wrap */
        .search-section-label {
            flex-basis: 100%;
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            color: #cad3db;
            padding-top: 10px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        }

        .img-thumbnail {
            width: 300px;
            height: 424px;
            border-radius: 8px;
            padding: 0px;
            border: 0px;
            object-fit: cover;
        }

        .img-thumbnail:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        /* Điều hướng bằng remote TV: hiệu ứng focus tương đương hover.
           Để rule riêng, KHÔNG gộp selector: engine cũ gặp pseudo lạ sẽ bỏ cả rule. */
        a:focus .img-thumbnail {
            transform: scale(1.05);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .anime-ep:focus {
            outline: 2px solid #60a5fa;
        }

        .form-select {
            width: auto;
        }

        .anime-card {
            position: relative;
            display: inline-block;
            /* TV yếu: bỏ qua layout/paint các card ngoài màn hình (engine cũ tự bỏ qua) */
            content-visibility: auto;
            contain-intrinsic-size: 300px 424px;
        }

        .anime-ep-box {
            position: absolute;
            align-items: center;
            justify-content: center;
            bottom: 10px;
            left: 10px;
            right: 10px;
            z-index: 2;
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
        }

        .anime-ep {
            flex-shrink: 0;
            width: 40px;
            height: 40px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
            cursor: pointer;
            text-decoration: none;
        }

        .anime-ep-text {
            font-weight: bold;
            font-size: 14px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
            color: #ffffff;
        }

        /* Nút P của mùa hiện tại trên card gom: nền xanh nổi bật khỏi
           hàng nút mùa (định nghĩa SAU .anime-ep để ghi đè nền đen) */
        .anime-ep-cur {
            background: #60a5fa;
        }

        /* Nút nguồn GD / KK / AVS đứng TRƯỚC các nút số tập trong hàng tập
           (xem addSrcButton): GD -> player Drive, KK -> artplayer kkphim,
           AVS -> trang animevietsub. Nền đậm hơn nút tập cho dễ phân biệt. */
        .anime-src-box {
            display: flex;
            gap: 2px;
        }

        .anime-src {
            flex-shrink: 0;
            width: 40px;
            height: 40px;
            background: rgba(0, 0, 0, 0.75);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
            cursor: pointer;
            text-decoration: none;
        }

        .anime-src-text {
            font-weight: bold;
            font-size: 13px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
            color: #ffffff;
        }

        .anime-src:focus {
            outline: 2px solid #60a5fa;
        }

        .anime-name-label {
            position: absolute;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.5);
            text-align: center;
            padding: 6px 8px 4px 8px;
            max-width: 100%;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
        }

        .user-avatar {
            right: 12px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #333;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
            overflow: hidden;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            cursor: pointer;
            transition: box-shadow 0.2s;
        }

        .user-avatar:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
        }

        .user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
        }

        .avatar-dropdown {
            position: absolute;
            top: 63px;
            background: #222;
            border-radius: 8px;
            min-width: 120px;
            z-index: 1100;
            display: none;
            flex-direction: column;
            align-items: stretch;
        }

        .avatar-dropdown.show {
            display: flex;
        }

        .avatar-dropdown button {
            background: none;
            border: none;
            color: #fff;
            padding: 10px 20px;
            text-align: center;
            width: 100%;
            cursor: pointer;
            font-size: 16px;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .avatar-dropdown button:hover {
            border-radius: 8px;
            background: #444;
        }


        #search-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #search-input {
            display: none;
            transition: all 0.3s ease;
        }

        /* Cùng đường kính 38px với .user-avatar cho hai nút tròn thẳng hàng.
           Không căn icon bằng flex: WebKit cũ trên TV bỏ qua display:flex đặt
           trên <button>, icon sẽ lệch. Icon 28px trong lòng 36px -> chừa
           margin 4px là căn giữa chính xác, không phụ thuộc baseline. */
        .search-btn {
            box-sizing: border-box;
            width: 38px;
            height: 38px;
            padding: 0;
            border: 1px solid #6c757d;
            color: #fff;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
        }

        .search-btn img {
            display: block;
            margin: 4px;
        }

        .search-btn:hover {
            background: #444;
        }

        /* Nút home logo r3mina đầu navbar: bấm về trang chủ (bỏ search/filter,
           về mặc định TV Show + năm hiện tại). Cùng đường kính 38px với
           .search-btn/.user-avatar cho cả hàng nút tròn thẳng hàng. */
        .home-btn {
            box-sizing: border-box;
            width: 38px;
            height: 38px;
            padding: 0;
            border: 1px solid #6c757d;
            color: #fff;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
        }

        .home-btn img {
            display: block;
            margin: 4px;
        }

        .home-btn:hover {
            background: #444;
        }

        .home-btn:focus {
            outline: 2px solid #60a5fa;
        }
    </style>
    <!-- defer: không chặn render; các script defer chạy theo đúng thứ tự trước DOMContentLoaded -->
    <script defer src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app-compat.js"></script>

<body>
    <div id="filter-container">
        <button class="home-btn" id="homeBtn" title="Trang chủ">
            <img width="28px" src="/anime/image/r3_player.png" alt="r3mina">
        </button>
        <select id="categoryFilter" class="form-select">
            <option value="">All Categories</option>
        </select>
        <select id="yearFilter" class="form-select">
            <option value="">All Years</option>
        </select>
        <select id="seasonFilter" class="form-select" style="display: none;">
            <option value="">All Seasons</option>
        </select>
        <div id="search-container">
            <input type="text" id="search-input" class="form-control" placeholder="Search anime...">
            <button class="search-btn" id="searchBtn">
                <img width="28px" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24'
                    %3E%3Cpath stroke='%23fff' stroke-linecap='round' stroke-linejoin='round' stroke-width='2'
                    d='M15.796 15.811 21 21m-3-10.5a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z' /%3E%3C/svg%3E"
                    alt="Search">
            </button>
        </div>
        <div class="user-avatar" title="User" id="user-avatar-btn">
            <img id="user-avatar" alt="User Avatar">

                <button id="signOutBtnDropdown">Sign Out</button>

    </div>
    <div class="image-container" id="imageContainer"></div>

    <script defer src="/anime/auth/auth.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/blueimp-md5/2.19.0/js/md5.min.js"></script>
    <script>
        const imageContainer = document.getElementById('imageContainer');
        var images = []

        const SHEET_CACHE_KEY = "animeSheetCache:v2";

        function loadCachedImages() {
            try {
                var c = JSON.parse(localStorage.getItem(SHEET_CACHE_KEY));
                if (c && c.images && c.images.length) return c.images;
            } catch (e) { }
            return null;
        }

        function saveCachedImages(imgs) {
            try {
                localStorage.setItem(SHEET_CACHE_KEY, JSON.stringify({ t: Date.now(), images: imgs }));
            } catch (e) { }
        }

        // Ảnh của cả 2 nguồn đều là bản gốc chưa resize trong khi thẻ chỉ hiển
        // thị 300x424: poster phimapi có cái 2000x3000 / 9.5MB, cover AniList
        // dạng PNG lên tới 749KB, poster Amazon tới 2.4MB.
        // Bọc qua Photon lấy bản ~300px (tự trả webp cho trình duyệt mới, jpeg
        // cho TV cũ không gửi Accept: image/webp). Lỗi thì img.onerror quay về
        // ảnh gốc lưu ở imageRaw.
        function thumbUrl(u) {
            if (!u || u.indexOf("http") !== 0) return u
            return "https://i0.wp.com/" + u.replace(/^https?:\/\//, "") + "?w=300&quality=70&ssl=1"
        }

        async function fetchImageData(id, gid) {
            var url = `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:json&tq&gid=${gid}`;

            res = await fetch(url)
            txt = await res.text()

            // Không dùng regex lookbehind: trình duyệt TV cũ (Chrome < 62) sẽ
            // SyntaxError ngay lúc parse script -> trắng trang
            var jsonString = txt.substring(txt.indexOf('"table":') + '"table":'.length, txt.lastIndexOf('});'))
            var data = JSON.parse(jsonString)

            var cols = data.cols.map(colonne => colonne.label)
            var table = data.rows.map(r => {
                return r.c.map(cel => {
                    try {
                        var value = cel.f ? cel.f : cel.v
                    } catch (e) {
                        var value = ''
                    }
                    return value
                })
            })
            images = table.map(row => {
                var image = {}
                cols.map((col, i) => {
                    image[col] = row[i]
                })
                if (image.image) {
                    image.imageRaw = image.image
                    image.image = thumbUrl(image.image)
                }
                return image
            })

            saveCachedImages(images)
            return images
        }

        function populateFilters(sYear = null, sCate = "TV Show", sSeason = "") {
            var categories = new Set();
            var years = new Set();
            var seasons = new Set();

            images.map(image => {
                // bỏ qua giá trị rỗng/null (kkphim không có season) — kẻo thành option rác
                // "undefined" trong select, chọn nó là grid trống
                if (image.category) categories.add(image.category);
                if (image.year) years.add(image.year);
                if (image.season) seasons.add(image.season);
            });

            categories = Array.from(categories).sort()
            years = Array.from(years).sort().reverse()
            seasons = Array.from(seasons).sort()

            const categoryFilter = document.getElementById('categoryFilter');
            // gọi lại được nhiều lần (render từ cache rồi render lại khi có data mới):
            // giữ option "All ..." đầu tiên, xoá các option cũ
            categoryFilter.options.length = 1;
            categories.map(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category;
                // giá trị URL thay dấu cách bằng '-' nên so khớp cả 2 dạng
                if (category == sCate || toUrlParam(category) == sCate) {
                    option.selected = true;
                }
                categoryFilter.appendChild(option);
            });

            const yearFilter = document.getElementById('yearFilter');
            yearFilter.options.length = 1;
            years.map((year, i) => {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year;
                if (sYear == null) {
                    var currentYear = new Date().getFullYear();
                    if (i == 0 && parseInt(year) <= currentYear) {
                        option.selected = true;
                    }
                } else {
                    if (year == sYear) {
                        option.selected = true;
                    }
                }
                yearFilter.appendChild(option);
            });

            const seasonFilter = document.getElementById('seasonFilter');
            seasonFilter.options.length = 1;
            seasons.map(season => {
                const option = document.createElement('option');
                option.value = season;
                option.textContent = season;
                if (season == sSeason || toUrlParam(season) == sSeason) {
                    option.selected = true;
                }
                seasonFilter.appendChild(option);
            });
        }


        function getAnimeUrl(url) {
            if (url.match(/(m3u8|mp4|json)/)) {
                return "player/#" + url;
            } else if (url.includes("facebook")) {
                return "fb/?v=" + url.split("=")[1]
            } else if (url.includes("youtube")) {
                return "yt/?" + url.split("?")[1]
            } else if (!url.includes("http")) {
                return url;
            } else if (url.includes("rophim")) {
                return url;
            } else {
                return "frame/#" + url;
            }
        }

        function renderEpisodesPage(epBox, episodes, page, history, srcBox) {
            const PAGE_SIZE = 54;
            epBox.innerHTML = "";
            // nút nguồn GD/KK/AVS luôn đứng đầu hàng, trước các nút số tập
            if (srcBox && srcBox.firstChild) {
                epBox.appendChild(srcBox);
            }
            let start = page * PAGE_SIZE;
            let end = start + PAGE_SIZE;
            let pageEpisodes = episodes.slice(start, end);
            const totalPages = Math.ceil(episodes.length / PAGE_SIZE);

            if (totalPages > 1) {
                if (page > 0 && page < totalPages - 1) {
                    pageEpisodes = [["❮❮", null], ...episodes.slice(start - 1, end - 1), ["❯❯", null]];
                } else if (page === 0 && totalPages > 1) {
                    if (episodes.length > PAGE_SIZE) {
                        pageEpisodes = [...episodes.slice(start, end - 1), ["❯❯", null]];
                    }
                } else if (page === totalPages - 1 && page > 0) {
                    pageEpisodes = [["❮❮", null], ...episodes.slice(start - 1, end)];
                }
            }

            for (const [idx, url] of pageEpisodes) {
                let o = document.createElement('a');
                o.classList.add('anime-ep');
                if (idx === "❮❮") {
                    o.textContent = "❮❮";
                    // href="#" để focus + bấm được bằng remote TV (anchor không href thì D-pad bỏ qua)
                    o.href = "#";
                    o.onclick = (e) => {
                        e.preventDefault();
                        page = Math.max(0, page - 1);
                        renderEpisodesPage(epBox, episodes, page, history);
                    };
                } else if (idx === "❯❯") {
                    o.textContent = "❯❯";
                    o.href = "#";
                    o.onclick = (e) => {
                        e.preventDefault();
                        page = Math.min(totalPages - 1, page + 1);
                        renderEpisodesPage(epBox, episodes, page, history);
                    };
                } else {
                    if (url) {
                        o.href = getAnimeUrl(url)
                        o.target = "_blank";
                    }
                    const epText = document.createElement('span');
                    epText.classList.add('anime-ep-text');
                    epText.textContent = idx;
                    if (url in history) {
                        epText.style.color = "#0d6efd";
                    }

                    o.appendChild(epText);
                }
                epBox.appendChild(o);
            }
        }

        // URL player mặc định của 1 dòng Sheet theo priority nguồn:
        // playlist (key Firebase artplayer) > anilist_id (key crawl m3u8) >
        // phimapi (slug kkphim) > gdrive (anilist id node Drive/m3u8).
        // Dùng cho cả poster click lẫn nút mùa của card gom mùa.
        function playerUrl(image) {
            if (image.playlist) {
                return `/anime/artplayer/?id=${image.playlist}`
            } else if (image.anilist_id) {
                return `/anime/artplayer/?id=${image.anilist_id}`
            } else if (image.phimapi) {
                return `/anime/artplayer/?k=${image.phimapi}`
            } else if (image.gdrive) {
                return `/anime/artplayer/?id=${image.gdrive}`
            }
            return image.url || ""
        }

        // Các mùa của 1 bộ sort theo năm rồi tên — "Phần 2" đứng sau
        // "Phần 1", "Part 2" sau phần gốc (tên mùa là tiền tố của tên gốc)
        function sortSeriesMembers(members) {
            return members.slice().sort(function (a, b) {
                var ya = parseInt(a.year) || 0;
                var yb = parseInt(b.year) || 0;
                if (ya != yb) return ya - yb;
                return String(a.name || "").localeCompare(String(b.name || ""));
            });
        }

        function createAnimeCard(image, history, seasons, current) {
            const animeCard = document.createElement('div');
            animeCard.classList.add('anime-card');

            // Card gom mùa: "mùa hiện tại" = dòng khớp filter đang xem
            // (current) — poster, nút nguồn GD/KK/AVS và nút P được highlight
            // theo mùa này. Ảnh bìa + tên bộ vẫn lấy từ dòng đại diện (mùa 1)
            // cho ổn định khi đổi filter. Card đơn: current bỏ qua.
            var show = (seasons && current) ? current : image;
            // mùa hiện tại không có nguồn phát nào (playerUrl rỗng, vd dòng
            // chỉ có ảnh bìa) -> poster + nút nguồn quay về dòng đại diện
            if (seasons && !playerUrl(show)) show = image;

            const link = document.createElement('a');

            // Mặc định bấm ảnh bìa -> artplayer theo priority nguồn của
            // playerUrl() (playlist > anilist_id > kkphim > gdrive). Bộ chỉ
            // có link Drive (không crawl m3u8) sẽ được artplayer chuyển tiếp
            // sang player Drive. Nút nguồn riêng: xem addSrcButton bên dưới.
            var url = playerUrl(show)

            if (url) {
                link.href = getAnimeUrl(url)
            }
            // link.target = "_blank";

            const img = document.createElement('img');
            img.classList.add('img-thumbnail');
            // chỉ tải ảnh khi cuộn tới + decode ngoài main thread; width/height
            // khai báo trước để không giật layout khi ảnh về
            img.loading = 'lazy';
            img.decoding = 'async';
            img.width = 300;
            img.height = 424;
            // Photon lỗi/chặn -> quay về ảnh gốc, cuối cùng mới tới placeholder
            img.onerror = function () {
                if (image.imageRaw && this.src !== image.imageRaw) {
                    this.src = image.imageRaw;
                    return;
                }
                this.onerror = null;
                this.src = "/anime/image/lazy.png";
            };
            img.src = image.image || "/anime/image/lazy.png";

            link.appendChild(img);

            const epBox = document.createElement('div');
            epBox.classList.add('anime-ep-box');

            // Nút nguồn GD / KK / AVS đứng TRƯỚC các nút số tập trong cùng hàng
            // (renderEpisodesPage prepend lại đầu hàng mỗi khi đổi trang):
            // GD -> player Drive, KK -> artplayer nguồn kkphim, AVS -> trang
            // animevietsub (url Sheet, qua frame/#). Chỉ nút nào có dữ liệu mới hiện.
            const srcBox = document.createElement('div');
            srcBox.classList.add('anime-src-box');

            function addSrcButton(label, href) {
                const o = document.createElement('a');
                o.classList.add('anime-src');
                o.href = href;
                const t = document.createElement('span');
                t.classList.add('anime-src-text');
                t.textContent = label;
                o.appendChild(t);
                srcBox.appendChild(o);
            }

            if (show.gdrive) {
                addSrcButton("GD", `/anime/gdrive/?id=${show.gdrive}`);
            }
            if (show.phimapi) {
                addSrcButton("KK", `/anime/artplayer/?k=${show.phimapi}`);
            }
            // Chỉ hiện nút AVS khi url Sheet là trang animevietsub (host
            // animevietsub.*) — các dòng url nguồn khác (yeuphim, motchill,
            // bilibili, youtube, facebook…) là nút AVS thừa/sai nhãn; poster
            // click vẫn dẫn link đó như cũ.
            if (show.url && /^(https?:\/\/)?(www\.)?animevietsub\./i.test(String(show.url))) {
                addSrcButton("AVS", getAnimeUrl(show.url));
            }

            // Card gom mùa (seasons = danh sách dòng các mùa đã sort): hàng
            // nút nguồn GD/KK/AVS của mùa hiện tại + nút P1..Pn, nút của mùa
            // hiện tại được highlight (tên mùa nằm ở header trên cùng).
            // Nút mùa dẫn thẳng player của dòng tương ứng theo playerUrl().
            if (seasons) {
                var curIdx = 0;
                seasons.map(function (m, i) {
                    if (String(m.id) == String(show.id)) curIdx = i;
                });
                epBox.appendChild(srcBox);
                seasons.map(function (member, i) {
                    const o = document.createElement('a');
                    o.classList.add('anime-ep');
                    if (i == curIdx) o.classList.add('anime-ep-cur');
                    o.href = getAnimeUrl(playerUrl(member));
                    const t = document.createElement('span');
                    t.classList.add('anime-ep-text');
                    t.textContent = "P" + (i + 1);
                    o.appendChild(t);
                    epBox.appendChild(o);
                });
            } else if (image.episodes) {
                try {
                    const episodes = image.episodes
                        .split("\n")
                        .map(e => e.trim())
                        .filter(e => e)
                        .map(e => {
                            s = e.split(":");
                            ep = s[0].trim();
                            url = s.slice(1).join(":").trim();
                            return [ep, url];
                        })
                        // Bỏ nút tập dẫn link AVS trong cột episodes (host
                        // animevietsub.*): qua frame/ (iframe) AVS chặn không
                        // mở được -> nút thừa. Match theo HOST chứ không substring
                        // — kẻo dính link firebase .../animevietsub/<id>.json
                        // (m3u8, vẫn phát được qua player/).
                        .filter(a => !/^(https?:\/\/)?(www\.)?animevietsub\./i.test(String(a[1])))

                    renderEpisodesPage(epBox, episodes, 0, history, srcBox)
                } catch (e) {
                    console.log(e)
                }
            } else if (image.ep) {
                epBox.appendChild(srcBox);

                const epContainer = document.createElement('a');
                epContainer.classList.add('anime-ep');

                const epText = document.createElement('span');
                epText.classList.add('anime-ep-text');
                epText.textContent = image.ep;

                epContainer.appendChild(epText);
                epBox.appendChild(epContainer);
            } else {
                epBox.appendChild(srcBox);
            }

            if (image.name) {
                const nameLabel = document.createElement('div');
                nameLabel.classList.add('anime-name-label');
                // card gom mùa: header trên cùng ghi đúng tên mùa HIỆN TẠI
                // trong Sheet (show.name, vd "… 3rd Season") thay vì tên bộ
                // đã bỏ suffix — khớp với nút P được highlight
                nameLabel.textContent = seasons ? String(show.name || image.name || "") : image.name;
                animeCard.appendChild(nameLabel);
            }

            animeCard.appendChild(epBox);
            animeCard.appendChild(link);

            return animeCard
        }

        const authUrl = "/anime/auth"
        const avatarBtn = document.getElementById('user-avatar-btn');
        const filterContainer = document.getElementById('filter-container');
        const userAvatar = document.getElementById('user-avatar');
        const avatarDropdown = document.getElementById('avatarDropdown');
        const selectedCategory = document.getElementById('categoryFilter');
        const selectedYear = document.getElementById('yearFilter');
        const selectedSeason = document.getElementById('seasonFilter');
        const searchBtn = document.getElementById('searchBtn');
        const searchInput = document.getElementById('search-input');


        async function handleSearch() {
            if (!searchInput.style.display || searchInput.style.display === "none") {
                searchInput.style.width = selectedCategory.offsetWidth + selectedYear.offsetWidth + 10 + "px";
                searchInput.style.display = "block";
                selectedCategory.style.display = "none";
                selectedYear.style.display = "none";
                searchInput.focus();
            } else {
                const url = new URL(window.location.href);
                url.searchParams.set('q', searchInput.value);
                // search mode bỏ filter nên dọn param filter cũ khỏi URL
                ["cate", "year", "season"].forEach(key => url.searchParams.delete(key));
                window.history.replaceState({}, '', url);
                imageContainer.innerHTML = '';

                await initData()

                searchInput.style.display = "none";
                selectedCategory.style.display = "block";
                selectedYear.style.display = "block";
                searchInput.blur();

            }
        }

        searchInput.addEventListener('keydown', async (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                await handleSearch()
            }
        });
        searchBtn.addEventListener('click', async () => {
            await handleSearch()
        });

        // nút home logo: về trang chủ mặc định (bỏ ?q= và filter về TV Show
        // + năm hiện tại) — cùng hành vi logo r3mina trên control bar player
        document.getElementById('homeBtn').addEventListener('click', function () {
            window.location.href = "/anime"
        });

        function displayImages() {
            const imageContainer = document.getElementById('imageContainer');
            imageContainer.innerHTML = '';
            const history = JSON.parse(localStorage.getItem("history")) || {};

            // search mode: kết quả gắn nhãn nguồn _search ('sheet' | 'kk') —
            // chia 2 section, dòng Sheet (nút tập/GD/KK đầy đủ) trước
            if (images.length && images.some(i => i._search)) {
                appendSearchSection(imageContainer, "Từ Sheet", images.filter(i => i._search == "sheet"), history);
                appendSearchSection(imageContainer, "Từ kkphim", images.filter(i => i._search == "kk"), history);
                return;
            }
            imageContainer.appendChild(buildCardsFragment(images, history));
        }

        // tiêu đề 1 section kết quả search (flex-basis 100% chiếm trọn hàng
        // trong image-container flex-wrap), kèm số kết quả
        function appendSearchSection(container, title, list, history) {
            const fragment = buildCardsFragment(list, history);
            if (!fragment.childNodes.length) return;
            const h = document.createElement('div');
            h.classList.add('search-section-label');
            h.textContent = title + " (" + fragment.childNodes.length + ")";
            container.appendChild(h);
            container.appendChild(fragment);
        }

        // lọc theo filter đang chọn + gom các dòng cùng bộ (cột series) thành
        // card, trả về fragment card (dùng chung grid thường và 2 section search)
        function buildCardsFragment(list, history) {
            var filteredImages = list.filter(image => {
                return (
                    (!selectedCategory.value || image.category == selectedCategory.value) &&
                    (!selectedYear.value || image.year == selectedYear.value) &&
                    (!selectedSeason.value || image.season == selectedSeason.value)
                );
            });

            filteredImages = filteredImages.sort((a, b) => b.status.localeCompare(a.status))

            // Gom các dòng cùng bộ (cột series) thành 1 card duy nhất: dòng
            // đại diện là dòng có id == series (mùa 1), các mùa còn lại thành
            // nút P1..Pn trên card. Card hiện khi BẤT KỲ mùa nào khớp filter
            // (năm/mùa chiếu) — bộ trải nhiều năm vẫn tìm thấy ở mọi năm;
            // nút mùa luôn đủ mọi mùa (lấy từ toàn bộ list, không qua filter).
            var seriesAll = {};
            list.map(image => {
                var s = String(image.series || "").trim();
                if (s) {
                    if (!seriesAll[s]) seriesAll[s] = [];
                    seriesAll[s].push(image);
                }
            });
            var seenSeries = {};

            // gom vào fragment, append 1 lần để tránh reflow liên tục trên TV yếu
            const fragment = document.createDocumentFragment();
            filteredImages.map(image => {
                var s = String(image.series || "").trim();
                if (s) {
                    if (seenSeries[s]) return;
                    seenSeries[s] = true;
                    var members = sortSeriesMembers(seriesAll[s]);
                    // dòng đại diện: id == series (mùa 1); fallback dòng đầu
                    var rep = members.filter(m => String(m.id) == s)[0] || members[0];
                    // mùa hiện tại = dòng khớp filter (image) — highlight nút P
                    // + nhãn tên mùa + nút nguồn/poster theo mùa này
                    fragment.appendChild(createAnimeCard(rep, history, members, image));
                } else {
                    fragment.appendChild(createAnimeCard(image, history));
                }
            })
            return fragment;
        }

        // giá trị filter trên URL dùng '-' thay dấu cách (?cate=TV-Show) — link sạch dễ share
        function toUrlParam(value) {
            return String(value || "").replace(/ /g, "-")
        }

        // ghi filter đang chọn lên URL (?cate=&year=&season=) để share/bookmark lại đúng trạng thái
        function syncFilterParams() {
            const url = new URL(window.location.href);
            [["cate", selectedCategory.value], ["year", selectedYear.value], ["season", selectedSeason.value]].forEach(([key, value]) => {
                if (value) {
                    url.searchParams.set(key, toUrlParam(value));
                } else {
                    url.searchParams.delete(key);
                }
            });
            window.history.replaceState({}, '', url);
        }

        function onFilterChange() {
            syncFilterParams();
            displayImages();
        }
        selectedCategory.addEventListener('change', onFilterChange);
        selectedYear.addEventListener('change', onFilterChange);
        selectedSeason.addEventListener('change', onFilterChange);

        function getUrlParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        const SHEET_ID = '12q04f4hwtVQjfVSUayDsgXLGGbqrl9urm8gp556nPQA';
        const SHEET_GID = "1193967919";

        // Bỏ dấu + lowercase để "dao hai tac" khớp "Đảo Hải Tác", "one piece"
        // khớp "One Piece". normalize NFD là ES6, TV cũ (Chrome 41+) vẫn chạy.
        function normalizeText(s) {
            return String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        }

        async function searchAnime(q) {
            // q rỗng (submit ô search trống) -> coi như không search, về grid thường
            if (!String(q || "").trim()) {
                return fetchImageData(SHEET_ID, SHEET_GID)
            }

            selectedCategory.value = ""
            selectedYear.value = ""
            selectedSeason.value = ""

            const nq = normalizeText(q)

            // Hai nguồn chạy song song, mỗi nguồn hỏng độc lập (Sheet chết vì
            // mạng thì vẫn hiện kết quả kkphim và ngược lại):
            // - Sheet: lọc theo tên, các card giữ nguyên nút tập/GD/KK/AVS
            // - kkphim (phimapi): như cũ
            const sheetPromise = fetchImageData(SHEET_ID, SHEET_GID).catch(err => {
                console.error(err)
                return []
            })
            const kkPromise = fetch(`https://phimapi.com/v1/api/tim-kiem?keyword=${q}&page=1&limit=64&sort_field=year&sort_order=desc`)
                .then(res => res.json())
                .then(data => data.data.items.map(item => {
                    const poster = (item.poster_url && item.poster_url.indexOf("http") === 0) ? item.poster_url : data.data.APP_DOMAIN_CDN_IMAGE + "/" + item.poster_url
                    return {
                        id: item._id,
                        name: item.origin_name,
                        image: thumbUrl(poster),
                        imageRaw: poster,
                        category: item.type,
                        year: item.year,
                        phimapi: item.slug,
                        status: ""
                    }
                }))
                .catch(err => {
                    console.error(err)
                    return []
                })

            const [sheet, kkItems] = await Promise.all([sheetPromise, kkPromise])

            // slug kkphim -> dòng Sheet tương ứng (toàn bộ Sheet, không chỉ dòng
            // khớp tên): kết quả kkphim mà bộ đó CÓ trong Sheet được thay bằng bản
            // Sheet (đầy đủ nút tập/GD/playlist) và đẩy lên section "Từ Sheet"
            // đầu trang — tên Sheet là romaji nên từ khóa tiếng Việt ("dao hai
            // tac") chỉ khớp qua kkphim, khi đó vẫn phải hiện bản Sheet lên trên.
            const sheetBySlug = {}
            sheet.map(img => { if (img.phimapi) sheetBySlug[img.phimapi] = img })

            // Nhiều dòng Sheet (anime crawl AVS) không điền slug kkphim, khi đó
            // khớp kk item qua TÊN đã normalize (bỏ dấu + bỏ ký tự đặc biệt):
            // kk "One Piece" -> dòng Sheet "One Piece" (slug rỗng).
            const sheetByName = {}
            sheet.map(img => {
                var key = normalizeText(img.name).replace(/[^a-z0-9]/g, "")
                if (key && !sheetByName[key]) sheetByName[key] = img
            })
            const kkToSheet = item =>
                sheetBySlug[item.phimapi] ||
                sheetByName[normalizeText(item.name).replace(/[^a-z0-9]/g, "")]

            // section đầu: dòng Sheet khớp tên với từ khóa + dòng Sheet tương
            // ứng của kết quả kkphim (trùng slug hoặc trùng tên). Dedupe theo
            // object — 1 dòng chỉ 1 lần.
            const seen = new Set()
            const sheetHits = []
            const pushSheet = img => {
                if (!seen.has(img)) {
                    seen.add(img)
                    sheetHits.push(img)
                }
            }
            sheet.filter(img => img.name && normalizeText(img.name).indexOf(nq) !== -1).map(pushSheet)
            kkItems.map(item => { if (kkToSheet(item)) pushSheet(kkToSheet(item)) })

            // section sau: kết quả kkphim không có trong Sheet
            const kkHits = kkItems.filter(item => !kkToSheet(item))

            // gắn nhãn nguồn để displayImages chia 2 section "Từ Sheet" /
            // "Từ kkphim" (xem appendSearchSection)
            sheetHits.map(img => { img._search = "sheet" })
            kkHits.map(item => { item._search = "kk" })

            return sheetHits.concat(kkHits)
        }

        function prefetchData() {
            const q = getUrlParameter("q")
            if (q) {
                return searchAnime(q)
            }
            return fetchImageData(SHEET_ID, SHEET_GID);
        }

        // bắt đầu tải data ngay khi DOM sẵn sàng, song song với vòng check auth
        var pendingData = null;

        async function initData() {
            const q = getUrlParameter("q")
            const dataPromise = pendingData || prefetchData()
            pendingData = null

            if (q) {
                images = await dataPromise
                // search mode vẫn phục hồi filter từ URL (?cate=&year=&season=):
                // user đổi filter trong lúc xem kết quả search thì param đã được ghi
                // qua syncFilterParams, reload/share link phải giữ đúng trạng thái đó
                populateFilters(getUrlParameter("year") || "", getUrlParameter("cate") || "", getUrlParameter("season") || "")
                displayImages()
                return
            }

            // có cache từ lần trước -> hiện ngay, data mới về sau sẽ render lại (stale-while-revalidate)
            // phục hồi filter từ param URL (?cate=&year=&season=), thiếu thì dùng mặc định như populateFilters
            const urlCate = getUrlParameter("cate") || "TV Show";
            const urlYear = getUrlParameter("year");
            const urlSeason = getUrlParameter("season") || "";

            const cached = loadCachedImages()
            var renderedFromCache = false
            if (cached) {
                images = cached
                populateFilters(urlYear, urlCate, urlSeason)
                displayImages()
                renderedFromCache = true
            }

            try {
                const fresh = await dataPromise
                if (renderedFromCache && JSON.stringify(fresh) === JSON.stringify(cached)) {
                    return
                }
                images = fresh
                if (renderedFromCache) {
                    // giữ nguyên filter user đang chọn khi render lại
                    populateFilters(selectedYear.value, selectedCategory.value, selectedSeason.value)
                } else {
                    populateFilters(urlYear, urlCate, urlSeason)
                }
                displayImages()
            } catch (err) {
                console.error(err)
                if (!renderedFromCache) throw err
            }
        }

        document.addEventListener('DOMContentLoaded', function () {
            pendingData = prefetchData()

            firebase.auth().onAuthStateChanged(async function (user) {
                if (!user) {
                    window.location.href = authUrl;
                    return;
                }

                if (user.photoURL && window.location.hostname != "localhost") {
                    userAvatar.src = user.photoURL;
                } else {
                    const emailHash = md5(user.email.trim().toLowerCase());
                    const gravatarUrl = `https://www.gravatar.com/avatar/${emailHash}?d=identicon&s=200`;
                    userAvatar.src = gravatarUrl;
                }
                avatarBtn.style.display = "flex"
                filterContainer.style.display = "flex"
                initData()
            });
        });

        document.addEventListener('click', function (event) {
            if (avatarBtn.contains(event.target)) {
                avatarDropdown.classList.toggle('show');
            } else if (!avatarDropdown.contains(event.target)) {
                avatarDropdown.classList.remove('show');
            }
        });
        document.getElementById('signOutBtnDropdown').onclick = function () {
            if (window.firebase && firebase.auth) {
                firebase.auth().signOut().then(function () {
                    window.location.href = authUrl;
                });
            }
        };
    </script>
