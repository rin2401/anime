<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Auth</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" href="/anime/image/r3_512.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Anime">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a1a1a">
    <link rel="manifest" href="/anime/manifest.json">
    <link rel="icon" type="image/png" href="/anime/image/r3_512.png">
    <meta property="og:image" content="/anime/image/r3.png">

    <link type="text/css" rel="stylesheet" href="https://www.gstatic.com/firebasejs/ui/6.1.0/firebase-ui-auth.css" />
    <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/ui/6.1.0/firebase-ui-auth.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/blueimp-md5/2.19.0/js/md5.min.js"></script>
    <script src="/anime/auth/auth.js"></script>
    <script>
        var HOME_URL = "/anime"

        var uiConfig = {
            signInFlow: 'popup',
            signInSuccessUrl: HOME_URL,
            callbacks: {
                signInSuccessWithAuthResult: function (authResult) {
                    var user = authResult && authResult.user;
                    if (user && user.email) return true; // chuyển hướng bình thường
                    rejectNoEmail(user);
                    return false; // không chuyển hướng, form sẽ vẽ lại sau signOut
                }
            },
            signInOptions: [
                firebase.auth.GoogleAuthProvider.PROVIDER_ID,
                // firebase.auth.FacebookAuthProvider.PROVIDER_ID,
                // firebase.auth.TwitterAuthProvider.PROVIDER_ID,
                // firebase.auth.GithubAuthProvider.PROVIDER_ID,
                firebase.auth.EmailAuthProvider.PROVIDER_ID,
                // firebase.auth.PhoneAuthProvider.PROVIDER_ID,
                // firebaseui.auth.AnonymousAuthProvider.PROVIDER_ID
            ],
            tosUrl: HOME_URL,
            privacyPolicyUrl: HOME_URL,
        };

        var auth = firebase.auth();
        var ui = new firebaseui.auth.AuthUI(auth);

        // Google sign-in qua webview/IAB có lúc trả về account KHÔNG có email
        // (tài khoản công ty/Workspace bị hạn chế chia sẻ email) — Firebase
        // không khớp được email nên tạo account mới rác, tách lịch sử xem của
        // cùng một người ra nhiều uid. Chặn kiểu sign-in này ngay từ đầu, buộc
        // đăng nhập lại bằng Gmail cá nhân để khớp/link vào account đã có.
        var NO_EMAIL_MSG = 'Tài khoản Google này không cấp email (thường là tài khoản công ty/Workspace bị hạn chế) nên không thể đồng bộ lịch sử xem. Hãy đăng nhập lại bằng tài khoản Gmail cá nhân.';

        function rejectNoEmail(user) {
            auth.signOut().then(function () {
                alert(NO_EMAIL_MSG);
                ui.reset();
            });
        }

        auth.onAuthStateChanged(function (user) {
            if (user) {
                if (user.email) {
                    window.location.href = HOME_URL;
                } else {
                    rejectNoEmail(user);
                }
            } else {
                ui.reset();
                ui.start('#firebaseui-auth-container', uiConfig);
            }
        });

        // firebaseui không có link "Trouble signing in?" trên màn "You already
        // have an account" (email chỉ có provider Google), nên thêm nút gửi
        // thư đặt lại mật khẩu riêng — luôn hiện dưới form mọi màn hình.
        // Script nằm trong <head> nên phải chờ DOM mới gắn được listener.
        var FORGOT_ERRORS = {
            'auth/invalid-email': 'Email không hợp lệ.',
            'auth/user-not-found': 'Không tìm thấy account với email này.'
        };
        document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('forgot-password-link').addEventListener('click', function (event) {
                event.preventDefault();
                var email = window.prompt('Nhập email đã đăng ký để nhận thư đặt lại mật khẩu:', '');
                if (!email) return;
                email = email.trim();
                auth.sendPasswordResetEmail(email).then(function () {
                    alert('Đã gửi thư đặt lại mật khẩu tới ' + email + '. Mở thư (kiểm tra cả Spam) và bấm link để đặt mật khẩu mới, sau đó đăng nhập bằng email + mật khẩu mới.');
                }).catch(function (err) {
                    alert(FORGOT_ERRORS[err && err.code] || 'Không gửi được thư: ' + ((err && err.code) || err));
                });
            });
        });
    </script>
    <style>
        body,
        html {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        #firebaseui-auth-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #forgot-password {
            text-align: center;
            margin-top: 12px;
        }

        #forgot-password-link {
            color: #5f6368;
            font-size: 14px;
        }

        #logo {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 300px;
        }
    </style>
</head>

<body>
    <div>
        <img id="logo" src="/anime/image/r3.png" alt="Logo">
    </div>
    <div id="firebaseui-auth-container"></div>
    <div id="forgot-password">
        <a href="#" id="forgot-password-link">Quên mật khẩu?</a>
    </div>
</body>

</html>
