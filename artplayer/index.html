<html>

<head>
    <title>ArtPlayer</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" href="/anime/image/r3_512.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Anime">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a1a1a">
    <link rel="manifest" href="/anime/manifest.json">
    <link rel="icon" type="image/png" href="/anime/image/r3_512.png">
    <meta property="og:image" content="/anime/image/r3.png">

    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://phimapi.com">
    <link rel="preconnect" href="https://r3fire.firebaseio.com">

    <!-- defer: không chặn render, vẫn giữ đúng thứ tự; code khởi động chạy sau DOMContentLoaded -->
    <script defer src="https://cdn.jsdelivr.net/npm/hls.js@1.6.16/dist/hls.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/artplayer@5.4.0/dist/artplayer.js"></script>
    <script defer
        src="https://cdn.jsdelivr.net/npm/artplayer-plugin-hls-control@1.1.0/dist/artplayer-plugin-hls-control.js"></script>
    <script defer src="artplayer-plugin-playlist.browser.js"></script>
    <script defer
        src="https://cdn.jsdelivr.net/npm/artplayer-plugin-multiple-subtitles@1.1.0/dist/artplayer-plugin-multiple-subtitles.min.js"></script>
    <!-- compat SDK + auth.js + user-history.js: ghi lịch sử xem sync đa thiết bị
         (defer giữ đúng thứ tự — user-history cần app đã khởi tạo) -->
    <script defer src="https://www.gstatic.com/firebasejs/12.14.0/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/12.14.0/firebase-auth-compat.js"></script>
    <script defer src="/anime/auth/auth.js"></script>
    <script defer src="/anime/auth/user-history.js"></script>
    <script defer src="/anime/room/chat.js"></script>
    <style>
        html,
        body {
            margin-left: 0;
            margin-top: 0;
            width: 100vw;
            overflow: hidden;
            background-color: black;
        }

        .art-video-player {
            --art-padding: 0 !important;
        }

        /* Panel playlist dạng lưới: các tập là ô nút đều nhau, 5 ô mỗi hàng
           (grid 5 cột), header mùa in đậm chiếm trọn 1 hàng để tách nhóm.
           Panel .art-selector-list absolute cần width tường minh; neo phải để
           không tràn mép player. !important thắng CSS artplayer chèn SAU
           <style> trang. Grid không hỗ trợ (TV rất cũ) thì panel tự rơi về
           danh sách dọc của artplayer — không vỡ layout. */
        .art-control-selector .art-selector-list {
            display: grid !important;
            grid-template-columns: repeat(5, 1fr) !important;
            gap: 6px !important;
            width: 240px !important;
            padding: 8px !important;
            box-sizing: border-box !important;
            left: auto !important;
            right: 0 !important;
        }

        .art-control-selector .art-selector-list .art-selector-item {
            width: auto !important;
            min-width: 0 !important;
            padding: 5px 0 !important;
            margin: 0 !important;
            text-align: center !important;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }

        /* Tập đang xem: đổ nền màu theme + chữ trắng — mặc định artplayer chỉ
           đổi màu CHỮ thành xanh là quá mờ trên nền tối, khó phát hiện ngay */
        .art-control-selector .art-selector-list .art-selector-item.art-current {
            background: #23ade5 !important;
            border-color: #23ade5 !important;
            color: #fff !important;
        }

        .art-selector-list .art-season-header {
            grid-column: 1 / -1 !important;
            padding: 8px 0 2px !important;
            font-weight: 700;
            color: #e5e7eb;
            font-size: 13px;
            text-align: left;
        }

        /* Mobile hẹp: ẩn nút logo r3mina — control bar stock không đủ chỗ cho
           hết cụm nút phải, logo chiếm ~56px không thiết yếu trên điện thoại
           (desktop vẫn hiện). */
        @media (max-width: 700px) {
            .art-control-r3mina {
                display: none !important;
            }
        }

        /* ── Chat phòng xem chung dạng SIDEBAR (RoomChat, cùng room/chat.js
           với trang room): desktop = cột cạnh video (video tự co, không đè),
           mobile hẹp = khối dưới video kiểu YouTube live. Chỉ hiện khi đã
           tạo phòng. Fullscreen thật: sidebar ngoài cây fullscreen element
           nên tạm ẩn — chấp nhận, chat là phụ. */
        #room-layout {
            position: fixed;
            inset: 0;
            display: flex;
        }

        #video-area {
            flex: 1;
            min-width: 0;
            position: relative;
            height: 100vh;
        }

        /* Container player: fill khít #video-area (trước đây là con trực tiếp
           của body) — kích thước tường minh để chat sidebar co video đúng */
        .artplayer-app {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        #chat-side {
            display: none;
            width: 300px;
            max-width: 40vw;
            flex-direction: column;
            background: #14161a;
            border-left: 1px solid rgba(255, 255, 255, 0.08);
        }

        #room-layout.chat-open #chat-side {
            display: flex;
        }

        #chat-panel {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }

        @media (max-width: 900px) {
            #room-layout {
                flex-direction: column;
            }

            /* video 16:9 tràn mép, trần 56vh để chat luôn có chỗ dưới nó */
            #video-area {
                flex: 0 0 auto;
                height: min(calc(100vw * 9 / 16), 56vh);
            }

            #chat-side {
                width: 100%;
                max-width: none;
                flex: 1;
                border-left: 0;
                border-top: 1px solid rgba(255, 255, 255, 0.08);
            }
        }

        #chat-toggle {
            position: fixed;
            top: calc(10px + env(safe-area-inset-top));
            right: 10px;
            width: 38px;
            height: 38px;
            border-radius: 19px;
            border: 0;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            z-index: 30;
        }

        #chat-toggle.active {
            background: #23ade5;
        }

    </style>
</head>

<body>
    <div id="room-layout">
        <div id="video-area">
            <div class="artplayer-app"></div>
        </div>
        <aside id="chat-side"><div id="chat-panel"></div></aside>
    </div>
    <button id="chat-toggle" type="button" aria-label="Chat" hidden>💬</button>

    <script>
        function getUrlParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        // Nhớ tập đang xem theo từng bộ (?id= hoặc ?k=). Link từ trang chủ không
        // kèm ?e nên nếu không lưu thì lần nào mở lại cũng nhảy về tập mới nhất.
        function getEpStoreKey() {
            const id = getUrlParameter('id');
            if (id) return 'artplayer:ep:id:' + id;
            const k = getUrlParameter('k');
            if (k) return 'artplayer:ep:k:' + k;
            return '';
        }

        // localStorage có thể ném lỗi (private mode, TV cũ chặn storage) -> bọc try
        function saveLastEp(id) {
            const key = getEpStoreKey();
            if (!key) return;
            try { localStorage.setItem(key, String(id)); } catch (e) { }
        }

        function loadLastEp() {
            const key = getEpStoreKey();
            if (!key) return null;
            try { return localStorage.getItem(key); } catch (e) { return null; }
        }

        // Token chặn race: đổi tập liên tiếp thì probe của tập cũ trả sau không
        // được ghi đè artwork của tập đang phát
        var _msToken = 0;
        // Poster của bộ đọc từ Sheet (cột image — AniList CDN cho anime,
        // phimimg cho kkphim); có muộn hơn lần set artwork đầu (Sheet fetch
        // async) -> updateArtwork được gọi lại khi Sheet về
        var sheetImage = '';
        var sheetTitle = '';
        var currentEpisode = null;
        // player instance cho currentDur() — updateParams chạy trước khi new
        // Artplayer xong nên mọi chỗ đọc đều phải guard null
        var art = null;
        // Định danh bộ đang mở cho lịch sử xem: ?id= node Firebase (playlist/
        // anilist id) hoặc ?k= slug kkphim. Key ổn định -> máy khác resume đúng bộ.
        var histItem = null;

        // Số tập hiển thị: key Firebase thay '.' bằng '_', hậu tố END mọi biến
        // thể ('2_END'/'2.end'/'2 END') hiện trần số — cùng quy ước chip panel
        // playlist
        function displayEp(id) {
            return String(id).replace(/_/g, '.').replace(/[\s._-]+end\s*$/i, '').trim();
        }

        // Tên bộ cho lịch sử: ưu tiên cột name Sheet (seasonSelector đã match),
        // fallback title tập bỏ đuôi " - <số>[ END]" (định dạng title nguồn:
        // "Tên - 1121"); bỏ đuôi KHÔNG số (vd "Re:Zero - Starting Life") giữ nguyên
        function baseTitle(fallback) {
            var s = String(sheetTitle || '') || String(fallback || '');
            return s.replace(/\s+-\s+\d+(\.\d+)?\s*(END)?$/i, '').trim() || s;
        }

        function currentDur() {
            try { return (art && art.duration) ? Math.round(art.duration) : 0; } catch (e) { return 0; }
        }

        // Entry chung cho lịch sử + yêu thích (itemKey/kind/key/eid/ep/title/poster)
        function buildEntry() {
            return {
                itemKey: histItem.itemKey,
                kind: histItem.kind,
                key: histItem.key,
                eid: String(currentEpisode.id),
                ep: displayEp(currentEpisode.id),
                title: baseTitle(currentEpisode.title).slice(0, 120),
                poster: sheetImage || currentEpisode.image || imageUrl,
            };
        }

        // Ghi 1 entry lịch sử xem (UserHistory tự merge localStorage + cloud)
        function recordHistory(t, keepalive) {
            if (!histItem || !currentEpisode || typeof UserHistory === 'undefined') return;
            var entry = buildEntry();
            entry.t = Math.round(t || 0);
            entry.dur = currentDur();
            UserHistory.save(entry, keepalive);
        }

        function updateParams(episode) {
            const url = new URL(window.location.href);
            url.searchParams.set('e', episode.id);
            window.history.replaceState({}, '', url);
            document.title = episode.title
            saveLastEp(episode.id)
            currentEpisode = episode;
            updateArtwork(episode);
            // Đổi/mở tập -> ghi entry ngay (t=0, timeupdate sẽ đẩy mốc thật);
            // UserHistory giữ max tiến độ nên không xoá mốc sâu của máy khác
            recordHistory(0);
            // Host đang mở phòng mà đổi tập -> phát url mới vào room node
            // (pos=0, playing=true: video:play ngay sau đó sẽ patch mốc thật)
            if (roomCode && currentEpisode && currentEpisode.url) {
                roomPatch({ url: currentEpisode.url, title: roomTitle(), pos: 0, playing: true });
            }
        }

        // ── Phòng xem chung ──
        // Host tạo phòng: ghi node room/{code} lên Firebase rồi share link
        // /anime/room/?id=<code>. Host xem tiếp bình thường ở trang này; mọi
        // play/pause/seek/đổi tập được phát vào room node (REST PATCH kèm
        // idToken) để người xem ở trang room đồng bộ theo. Rules cho phép ghi
        // room/{code} cho đúng host tạo phòng.
        var roomCode = null;
        var RTDB = 'https://r3fire.firebaseio.com';

        function roomTitle() {
            if (!currentEpisode) return '';
            return baseTitle(currentEpisode.title) + ' — Tập ' + displayEp(currentEpisode.id);
        }

        function roomPatch(patch) {
            if (!roomCode) return;
            patch.updatedAt = Date.now();
            var u = (typeof firebase !== 'undefined') ? firebase.auth().currentUser : null;
            if (!u) return;
            u.getIdToken().then(function (tok) {
                return fetch(RTDB + '/room/' + roomCode + '.json?auth=' + tok, {
                    method: 'PATCH',
                    body: JSON.stringify(patch),
                });
            }).catch(function () { });
        }

        function roomLink() {
            return location.origin + '/anime/room/?id=' + roomCode;
        }

        function createRoom() {
            var u = (typeof firebase !== 'undefined') ? firebase.auth().currentUser : null;
            if (!u) {
                art.notice.show = 'Đăng nhập để tạo phòng xem chung — trang /anime/auth/';
                return;
            }
            if (!currentEpisode || !currentEpisode.url) return;
            // Mã 6 ký tự dễ đọc/nhập (bỏ o0il1); trùng phòng cũ ~0 (30^6)
            var chars = 'abcdefghjkmnpqrstuvwxyz23456789';
            var code = '';
            for (var i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
            var payload = {
                host: u.uid,
                created: Date.now(),
                url: currentEpisode.url,
                title: roomTitle(),
                pos: (art && art.currentTime) || 0,
                playing: !!(art && art.playing),
                updatedAt: Date.now(),
            };
            u.getIdToken().then(function (tok) {
                return fetch(RTDB + '/room/' + code + '.json?auth=' + tok, {
                    method: 'PUT',
                    body: JSON.stringify(payload),
                });
            }).then(function (r) {
                if (!r.ok) throw new Error('HTTP ' + r.status);
                roomCode = code;
                prompt('Link phòng xem chung — copy gửi bạn bè:', roomLink());
                art.notice.show = 'Đã tạo phòng ' + code + ' — đang phát cho cả phòng';
                // Có phòng rồi -> hiện nút 💬; màn rộng mở sẵn sidebar chat
                // (mobile đóng cho phim tràn màn, bấm 💬 khi muốn chat)
                var chatBtn = document.getElementById('chat-toggle');
                if (chatBtn) chatBtn.hidden = false;
                if (window.innerWidth >= 900) {
                    var layout = document.getElementById('room-layout');
                    if (layout) {
                        layout.classList.add('chat-open');
                        chatBtn.classList.add('active');
                    }
                    setTimeout(function () { try { art.resize(); } catch (e) { } }, 60);
                }
            }).catch(function (e) {
                art.notice.show = 'Tạo phòng lỗi: ' + e;
            });
        }

        function updateArtwork(episode) {
            if (!episode || !('mediaSession' in navigator)) return;
            // Poster của tập (AVS/kkphim) hay bị chặn hotlink / 404 /
            // mixed-content, hoặc CDN nguồn bị media daemon của iOS
            // (lock screen) fetch không được dù WebKit trong trang load
            // được -> iOS hiện ô xám rỗng. Khai sizes LỆCH kích thước
            // thật (vd 512x512 cho ảnh 4K) iOS cũng từ chối hiện. Probe
            // lần lượt: ảnh qua Photon CDN (re-encode JPEG chuẩn) -> ảnh
            // gốc -> logo web (same-origin, chắc chắn hiện).
            var token = ++_msToken;
                // Debug lock screen iOS: &msart=logo -> CHỈ entry logo
                // same-origin; &msart=square -> CHỈ 1 entry poster Photon
                // crop vuông 512x512; &msart=pad -> CHỈ 1 entry crop vuông
                // neo trên data URL. Đúng 1 entry, không phụ gia.
                var msArt = getUrlParameter('msart');
                var debugRaw = msArt === 'logo' || msArt === 'square' || msArt === 'pad';
            // Ảnh CDN nguồn có khi daemon của iOS không fetch được -> lấy
            // qua Photon (trang chủ đã dùng cho grid, ổn định). Ảnh same-
            // origin giữ nguyên. dim -> crop vuông chính xác (resize=).
            var artworkSrc = function (src, dim) {
                if (!src || src.indexOf('http') !== 0 || src.indexOf(location.origin) === 0) return src;
                var q = dim ? 'resize=' + dim + ',' + dim : 'w=720';
                return 'https://i0.wp.com/' + src.replace(/^https?:\/\//, '') + '?' + q + '&ssl=1';
            };
            var setArtwork = function (src, w, h) {
                if (token !== _msToken) return;
                var type = /\.png($|\?)/i.test(src) ? 'image/png' : 'image/jpeg';
                // Ảnh nguồn nhỏ (poster ~100px) khai đúng size nhỏ thì iOS
                // lock screen TỪ CHỐI hiện (ô xám) — ảnh to vẫn chạy vì
                // entry to có sẵn. Khai thêm entry 512x512 cùng src để iOS
                // tự scale ảnh nhỏ lên (thừa với logo r3_512).
                var artwork = [{ src: src, sizes: w + 'x' + h, type: type }];
                if (!debugRaw) {
                    if (w !== 512 || h !== 512)
                        artwork.push({ src: src, sizes: '512x512', type: type });
                    if (src !== imageUrl) {
                        // Logo same-origin đứng CUỐI: nếu mọi entry ảnh phim
                        // daemon không fetch được thì còn hiện logo thay ô xám
                        artwork.push({ src: imageUrl, sizes: '512x512', type: 'image/png' });
                    }
                }
                // Lock screen iOS: title = nhãn tập (dòng lớn), artist = tên
                // bộ (dòng phụ — quy ước metadata: title là nội dung đang
                // phát, artist là tác giả). Không set album cho gọn. AVS
                // title là nhãn tập ("12 END") không có tên bộ — baseTitle
                // giữ nguyên nhãn khi không có Sheet thì artist rỗng thay vì
                // rác; hậu tố END trong key Firebase khai lại trên title.
                var endTag = /end/i.test(String(episode.id)) ? ' END' : '';
                var seriesName = baseTitle(episode.title);
                if (!sheetTitle && seriesName === String(episode.title).trim()) seriesName = '';
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: ('Tập ' + displayEp(episode.id) + endTag).trim(),
                    artist: seriesName.slice(0, 80),
                    artwork: artwork,
                });
            };
            var probeArtwork = function (srcs) {
                if (!srcs.length) return;
                var src = srcs[0];
                var img = new Image();
                img.onload = function () {
                    if (token !== _msToken) return;
                    // Ảnh degenerate không có kích thước nội tại -> đừng khai 0x0
                    var w = img.naturalWidth || 512;
                    var h = img.naturalHeight || w;
                    setArtwork(src, w, h);
                };
                img.onerror = function () {
                    if (token !== _msToken) return;
                    probeArtwork(srcs.slice(1));
                };
                img.src = src;
            };
            // Crop vuông neo TRÊN qua PHOTON: tham số crop=x,y,w,h theo
            // PHẦN TRĂM ảnh nguồn (docs developer.wordpress.com/docs/photon),
            // kèm resize=512,512. Ảnh dọc: dải full-width từ mép trên
            // (hpct = 100*w/h). Ảnh ngang: dải full-height căn giữa ngang.
            // Cùng host i0.wp.com đã chứng minh daemon iOS fetch được — crop
            // đẹp mà không cần canvas/data URL. (Trước đây tưởng Photon chỉ
            // crop giữa vì test sai cú pháp crop=top / crop=0,0 thiếu w,h.)
            var topSquareSrc = function (src, w, h) {
                if (!src || src.indexOf('http') !== 0 || src.indexOf(location.origin) === 0) return null;
                if (!w || !h) return null;
                var x = 0, wp = 100, hp = 100;
                if (h > w) hp = 100 * w / h;
                else if (w > h) { wp = 100 * h / w; x = (100 - wp) / 2; }
                return 'https://i0.wp.com/' + src.replace(/^https?:\/\//, '') +
                    '?crop=' + x.toFixed(2) + ',0,' + wp.toFixed(2) + ',' + hp.toFixed(2) +
                    '&resize=512,512&ssl=1';
            };
            // Vẽ crop vuông neo TRÊN từ ảnh ĐÃ LOAD (crossOrigin anon, Photon
            // gửi ACAO * nên không taint) ra data URL — đường dự phòng khi
            // URL crop của Photon không load được.
            var canvasCrop = function (img, done) {
                try {
                    var cv = document.createElement('canvas');
                    cv.width = 512; cv.height = 512;
                    var ctx = cv.getContext('2d');
                    var s = Math.max(512 / img.naturalWidth, 512 / img.naturalHeight) || 1;
                    var w = Math.max(512, Math.round(img.naturalWidth * s));
                    var h = Math.max(512, Math.round(img.naturalHeight * s));
                    ctx.drawImage(img, (512 - w) / 2, 0, w, h);
                    done(cv.toDataURL('image/jpeg', 0.9));
                } catch (e) { done(null); }
            };
            var loadCanvasCrop = function (src, done) {
                if (!src || src.indexOf('http') !== 0) { done(null); return; }
                var img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = function () {
                    if (token !== _msToken) return;
                    canvasCrop(img, done);
                };
                img.onerror = function () {
                    if (token === _msToken) done(null);
                };
                img.src = src;
            };
            var srcs;
            if (msArt === 'logo') {
                srcs = [imageUrl];
            } else if (msArt === 'square') {
                srcs = [artworkSrc(episode.image, 512)];
            } else if (msArt === 'pad') {
                // Debug: CHỈ entry crop neo trên, không fallback (bisect khi
                // nghi ngờ entry phụ gia của chế độ mặc định)
                loadCanvasCrop(artworkSrc(sheetImage || episode.image), function (dataUrl) {
                    if (token !== _msToken || !dataUrl) return;
                    setArtwork(dataUrl, 512, 512);
                });
                return;
            } else {
                // Mặc định: Photon crop vuông neo TRÊN (URL crop % + resize)
                // — đo tỉ lệ ảnh qua bản w=720 trước (crop của Photon theo
                // %), URL kết quả load được thì dùng luôn (URL thường, daemon
                // iOS fetch được, không cần data URL); fail thì vẽ canvas
                // data URL từ ảnh đã đo (cấu hình cũ user đã test); vẫn fail
                // thì chuỗi dự phòng: Photon crop giữa 512 -> gốc -> logo.
                var imgs = [];
                if (sheetImage) imgs.push(sheetImage);
                if (episode.image && episode.image !== sheetImage && episode.image !== imageUrl) imgs.push(episode.image);
                var fallback = [];
                imgs.map(function (im) { fallback.push(artworkSrc(im, 512)); });
                if (imgs.length) fallback.push(imgs[0]);
                fallback.push(imageUrl);
                if (!imgs.length) { probeArtwork(fallback); return; }
                var src0 = imgs[0];
                var img1 = new Image();
                img1.crossOrigin = 'anonymous';
                img1.onload = function () {

                    } else {

                    }
                };
                img1.onerror = function () {
                    if (token !== _msToken) return;
                    probeArtwork(fallback);
                };

                return;
            }

        }
        function createBlobUrl(data, mimeType = "application/vnd.apple.mpegurl") {
            const blob = new Blob([data], { type: mimeType });
            return URL.createObjectURL(blob);
        }

        function createBase64Url(data, mimeType = "application/vnd.apple.mpegurl") {
            return `data:${mimeType};base64,${btoa(data)}`;
        }

        function removeAds(m3u8, url) {
            var baseUrl = url.split("/").slice(0, -1).join("/") + "/"
            m3u8 = m3u8.replace(/#EXT-X-DISCONTINUITY.*?#EXT-X-DISCONTINUITY\n/sg, "#EXT-X-DISCONTINUITY\n");
            m3u8 = m3u8.replace(/(?:#EXT-X-DISCONTINUITY\n)+/g, "#EXT-X-DISCONTINUITY\n");

            m3u8 = m3u8.split('\n').map(line => {
                if (line.startsWith('#') || line.trim() === '') {
                    return line;
                }

                if (!line.match(/^https?:\/\//i)) {
                    return baseUrl + line;
                }

                return line;
            }).join('\n');

            return m3u8
        }

        // Config cho thiết bị yếu (smart TV ít RAM, mạng chậm):
        // - capLevelToPlayerSize: không tải quality cao hơn kích thước player
        // - buffer nhỏ + giải phóng phần đã xem để không phình RAM khi xem tập dài
        // - abrEwmaDefaultEstimate: khởi động ~1Mbps, tránh chọn nhầm quality cao khi mạng yếu
        var TV_HLS_CONFIG = {
            capLevelToPlayerSize: true,
            maxBufferLength: 20,
            maxBufferSize: 20 * 1000 * 1000,
            backBufferLength: 30,
            abrEwmaDefaultEstimate: 1000000,
        };

        // Loader lọc quảng cáo trên từng playlist thay vì tải trước rồi ép 1 quality:
        // giữ nguyên master playlist cho hls.js tự chọn level theo băng thông (ABR).
        var _adsFilterLoader = null;
        function getAdsFilterLoader() {
            if (!_adsFilterLoader) {
                _adsFilterLoader = class extends Hls.DefaultConfig.loader {
                    load(context, config, callbacks) {
                        if (context.type === 'manifest' || context.type === 'level') {
                            const onSuccess = callbacks.onSuccess;
                            callbacks.onSuccess = function (response, stats, ctx, networkDetails) {
                                if (typeof response.data === 'string' && response.data.indexOf('#EXTINF') !== -1) {
                                    response.data = removeAds(response.data, ctx.url);
                                }
                                onSuccess(response, stats, ctx, networkDetails);
                            };
                        }
                        super.load(context, config, callbacks);
                    }
                };
            }
            return _adsFilterLoader;
        }

        function playM3u8Text(video, m3u8, art) {
            if (Hls.isSupported()) {
                if (art.hls) art.hls.destroy();
                const hls = new Hls(TV_HLS_CONFIG);
                var blob = createBlobUrl(m3u8)
                hls.loadSource(blob);
                hls.attachMedia(video);
                art.hls = hls;
                art.on('destroy', () => hls.destroy());
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = createBase64Url(m3u8);
            }
        }

        async function playM3u8(video, url, art) {
            if (Hls.isSupported()) {
                if (art.hls) art.hls.destroy();
                const hls = new Hls(Object.assign({ loader: getAdsFilterLoader() }, TV_HLS_CONFIG));
                hls.loadSource(url);
                hls.attachMedia(video);
                art.hls = hls;
                art.on('destroy', () => hls.destroy());
                return;
            }

            // Safari native HLS: không can thiệp được request nên tải playlist,
            // lọc quảng cáo rồi phát qua data URL như trước
            var res = await fetch(url)
            if (!res.ok) {
                console.error(res);
                return
            }
            var m3u8 = await res.text()
            const regex = /.*?\.m3u8/gi;
            const links = m3u8.match(regex);
            if (links) {
                url = url.split("/").slice(0, -1).join("/") + "/" + links[0]
                res = await fetch(url)
                if (!res.ok) {
                    console.error(res);
                    return
                }
                m3u8 = await res.text()
            }

            m3u8 = removeAds(m3u8, url)
            if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = createBase64Url(m3u8);
            }
        }

        async function playJson(video, url, art) {
            res = await fetch(url)
            if (!res.ok) {
                console.error(res);
                return
            }
            var data = await res.json()
            var m3u8 = data.m3u8
            playM3u8Text(video, m3u8, art)
        }

        var imageUrl = "/anime/image/r3_512.png"

        // ── Đổi mùa trong player ──
        // Sheet catalog (bản published gviz, như trang chủ) là nguồn group:
        // các dòng cùng giá trị cột `series` là các mùa của một bộ. Mở player
        // bằng ?id= (playlist/gdrive/anilist id) hoặc ?k= (slug kkphim) → tìm
        // dòng tương ứng → các dòng cùng series thành mục "Mùa" trong setting
        // panel; chọn mùa = điều hướng sang URL player của mùa đó (mỗi mùa vẫn
        // là node Firebase / slug kkphim riêng nên tiến độ xem giữ nguyên).
        const SHEET_ID = '12q04f4hwtVQjfVSUayDsgXLGGbqrl9urm8gp556nPQA';
        const SHEET_GID = "1193967919";

        function playerUrlFromRow(row) {
            if (row.playlist) return '/anime/artplayer/?id=' + row.playlist;
            if (row.anilist_id) return '/anime/artplayer/?id=' + row.anilist_id;
            if (row.phimapi) return '/anime/artplayer/?k=' + row.phimapi;
            if (row.gdrive) return '/anime/artplayer/?id=' + row.gdrive;
            return '';
        }

        function fetchSheetRows() {
            var url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&tq&gid=${SHEET_GID}`;
            return fetch(url).then(res => res.text()).then(txt => {
                // Không dùng regex lookbehind: trình duyệt TV cũ (Chrome < 62)
                // SyntaxError ngay lúc parse script -> trắng trang
                var jsonString = txt.substring(txt.indexOf('"table":') + '"table":'.length, txt.lastIndexOf('});'))
                var data = JSON.parse(jsonString)
                var cols = data.cols.map(col => col.label)
                return data.rows.map(r => {
                    var row = {}
                    cols.map((col, i) => {
                        var cel = r.c[i]
                        row[col] = cel ? (cel.f ? cel.f : cel.v) : ''
                    })
                    return row
                })
            })
        }

        // Promise -> danh sách mùa [{url, label, current}] của bộ đang mở,
        // đã sort theo (year, name); [] khi bộ 1 mùa / không có trong Sheet.
        function seasonSelector(id, k) {
            return fetchSheetRows().then(rows => {
                var rid = String(id || '');
                var match = null;
                rows.map(row => {
                    if (rid && (String(row.playlist) == rid || String(row.gdrive) == rid
                        || String(row.anilist_id) == rid)) {
                        match = row;
                    } else if (!rid && k && String(row.phimapi) == String(k)) {
                        match = row;
                    }
                });
                // fallback cuối: ?id= trỏ thẳng cột id (không qua playlist)
                if (!match && rid) {
                    rows.map(row => { if (String(row.id) == rid) match = row });
                }
                // Poster của bộ từ cột image Sheet (AniList CDN cho anime,
                // phimimg cho kkphim) — nguồn artwork lock screen ổn định.
                // Tên bộ (cột name) dùng cho entry lịch sử xem gọn hơn title tập.
                if (match) {
                    sheetImage = String(match.image || '').trim();
                    sheetTitle = String(match.name || '').trim();
                }
                if (!match) return [];

                var series = String(match.series || '').trim();
                if (!series) return [];

                var members = rows.filter(row => String(row.series || '').trim() == series)
                    .sort((a, b) => {
                        var ya = parseInt(a.year) || 0, yb = parseInt(b.year) || 0;
                        if (ya != yb) return ya - yb;
                        return String(a.name || '').localeCompare(String(b.name || ''));
                    });
                return members.map((m, i) => ({
                    url: playerUrlFromRow(m),
                    label: 'Mùa ' + (i + 1),
                    current: m === match,
                }));
            }).catch(err => {
                console.error(err);
                return [];
            })
        }

        // Danh sách tập của một mùa khác trong cùng series: parse query từ URL
        // player của mùa đó (?id= node Firebase hoặc ?k= slug kkphim) rồi map
        // giống hệt luồng chính — để ?e= trên URL đích khớp M[] của player mùa đó.
        function fetchSeasonEpisodes(season) {
            var q = new URLSearchParams(season.url.split('?')[1] || '');
            var pid = q.get('id');
            if (pid) {
                return fetch(`https://r3fire.firebaseio.com/anime/${pid}.json`)
                    .then(res => res.json())
                    .then(data => mapEpisodes(data, pid));
            }
            var k = q.get('k');
            if (k) {
                return fetch('https://phimapi.com/phim/' + k)
                    .then(res => res.json())
                    .then(data => mapEpisodes(kkphimEpisodes(data)));
            }
            return Promise.resolve([]);
        }


        // Chờ DOMContentLoaded: các lib (hls.js, artplayer...) load bằng defer nên chỉ
        // chắc chắn sẵn sàng từ thời điểm này; fetch nhanh có thể về trước khi lib load xong
        document.addEventListener('DOMContentLoaded', function () {
            const id = getUrlParameter('id')
            const k = getUrlParameter('k')

            if (id) {
                const url = `https://r3fire.firebaseio.com/anime/${id}.json`
                fetch(url).then(response => response.json()).then(data => setupPlayer(data, id))
            } else if (k) {
                const url = "https://phimapi.com/phim/" + k
                fetch(url).then(response => response.json())
                    .then(data => setupPlayer(kkphimEpisodes(data)))
            }
        });

        // kkphim trả tập đúng thứ tự phát sóng, lastNum/extra bám theo đó.
        function kkphimEpisodes(data) {
            var lastNum = 0, extra = 0;
            return data.episodes[0].server_data.map((item) => {
                // Lấy số tập từ TÊN trước ('Tập 1004.5' -> 1004.5): kkphim bỏ
                // dấu chấm trong slug (tap-10045) nên slug 5 chữ số parse thành
                // 10045, các tập .5 rơi xuống cuối danh sách. Tên luôn ghi đúng
                // nhãn; chỉ về slug khi tên không có số.
                // slug 'tap-07' -> 7; 'full' (phim lẻ) -> 1. Slug không mang số
                // ('tap-sp' = OAD chèn giữa mùa, vd Attack on Titan phần 4) lấy
                // id thập phân ngay sau tập có số gần nhất: SP giữa 16 và 17
                // -> 16.5. epNum() vốn hiểu số lẻ nên nó tự nằm đúng chỗ.
                // Trước đây id rơi về 1 mặc định -> đụng tập 1: playlist hiện
                // 2 mục "- 1" và ?e=1 phát nhầm SP.
                // extra/100 phòng bộ có nhiều tập đặc biệt liên tiếp (16.5, 16.51).
                var slug = item.slug || ''
                var id = 1
                var nm = (item.name || '').match(/(\d+(?:\.\d+)?)/)
                if (nm) {
                    id = parseFloat(nm[1]); lastNum = id; extra = 0
                } else if (slug.indexOf("tap-") === 0) {
                    let rest = slug.slice(4);
                    let num = Number(rest);
                    if (Number.isInteger(num)) {
                        id = num; lastNum = num; extra = 0
                    } else {
                        id = lastNum + 0.5 + extra / 100; extra++
                    }
                }

                return {
                    id: id,
                    title: data.movie.origin_name + " - " + id,
                    file: item.link_m3u8,
                    // poster dọc trước — thumb_url nhiều bộ là ảnh 4K ngang
                    // (3840x2160) mà lock screen iOS không render nổi
                    image: data.movie.poster_url || data.movie.thumb_url || imageUrl,
                }
            })
        }



        // Số tập để sắp xếp: '7.5' -> 7.5, '07_5' -> 7.5 (key Firebase thay '.' bằng '_'),
        // tập không đánh số ('Xem Full', 'Special 6') -> 0, xếp lên đầu.
        function epNum(id) {
            return parseFloat(String(id).replace(/_/g, '.')) || 0;
        }

        // Map node Firebase HOẶC mảng kkphim (cả hai có dạng {id, title,
        // file/m3u8, image}) thành danh sách tập có `url` phát được. Duyệt bằng
        // Object.entries để dùng chung cho cả object lẫn array. animeId: key
        // Firebase của bộ đang mở (?id=). Cần cho các tập lưu THẲNG nội dung
        // m3u8 trong node (phim lẻ Ghibli/Shinkai...) thay vì có sẵn `file`.
        function mapEpisodes(data, animeId) {
            var episodeList = [];

            // node không tồn tại -> Firebase trả null
            data = data || {}

            Object.entries(data).forEach(([id, episode]) => {
                if (!episode) {
                    return
                }

                // Chỉ nhận tập CÓ nguồn phát. Cùng một node còn chứa tập chỉ có
                // drive_id (do crawler Drive đẩy lên); đưa vào playlist thì url undefined.
                if (!episode.file && !episode.m3u8) {
                    return
                }

                // Tập kiểu cũ chỉ có `m3u8` (nội dung playlist, không phải link):
                // trỏ về chính node đó trên Firebase để customType `json` (playJson)
                // tải rồi phát. Không nhân bản dữ liệu sang node mới.
                var file = episode.file ||
                    `https://r3fire.firebaseio.com/anime/${animeId}/${id}.json`

                id = episode.id || id
                episodeList.push({
                    id: id,
                    title: episode.title,
                    url: file,
                    image: episode.image || imageUrl,
                    subtitles: episode.subtitles,
                });
            });

            // Sắp xếp tăng dần theo số tập. Không tin thứ tự Object.entries: JS xếp
            // key số nguyên ('1'..'12') trước mọi key chữ, nên tập lẻ lưu dạng '07_5'
            // (Firebase không cho dấu '.' trong key) bị rơi xuống cuối danh sách.
            episodeList.sort(function (a, b) { return epNum(a.id) - epNum(b.id) });
            return episodeList;
        }

        function setupPlayer(data, animeId) {
            var M = {};

            var episodeList = mapEpisodes(data, animeId);
            episodeList.forEach(function (ep, i) { M[ep.id] = i });

            if (!episodeList.length) {
                // Bộ chỉ có drive_id (crawler Drive), chưa crawl m3u8 -> chuyển
                // sang player Drive cùng bộ thay vì đứng ở màn hình đen.
                if (animeId) {
                    window.location.href = '/anime/gdrive/?id=' + animeId
                    return
                }
                console.error('Không có tập nào có m3u8 để phát.');
                return
            }
            // ?e trên URL ưu tiên nhất; không có thì lấy tập đã xem dở đã lưu
            var e = getUrlParameter('e');
            if (e === null) e = loadLastEp();
            e = String(e);
            // không dùng ?? : trình duyệt TV cũ (Chrome < 80) fail ngay lúc parse
            // chưa xem (?e= không có, không có tập đã lưu) -> mặc định TẬP 1
            var initialIndex = (M[e] !== undefined) ? M[e] : 0;

            // Bật ghi lịch sử trước updateParams đầu (updateParams gọi recordHistory)
            var pid = getUrlParameter('id');
            var pk = getUrlParameter('k');
            if (pid) histItem = { itemKey: String(pid), kind: 'playlist', key: String(pid) };
            else if (pk) histItem = { itemKey: 'kk:' + pk, kind: 'phimapi', key: pk };

            updateParams(episodeList[initialIndex])

            // Chạm giữa màn hình trên MOBILE = play/pause: artplayer mặc định
            // tắt MOBILE_CLICK_PLAY nên tap không làm gì (desktop không bị ảnh
            // hưởng — click giữa vẫn toggle sẵn, double-click fullscreen).
            Artplayer.MOBILE_CLICK_PLAY = true;

            art = new Artplayer({
                container: '.artplayer-app',
                url: episodeList[initialIndex].url,
                poster: episodeList[initialIndex].image || imageUrl,
                setting: true,
                isLive: false,
                muted: false,
                autoplay: true,
                pip: true,
                // autoSize: true,
                autoMini: true,
                screenshot: false,
                setting: true,
                loop: true,
                flip: true,
                playbackRate: true,
                aspectRatio: true,
                fullscreen: true,
                fullscreenWeb: false,
                subtitleOffset: true,
                miniProgressBar: true,
                mutex: true,
                backdrop: true,
                playsInline: true,
                autoPlayback: true,
                // airplay: true,
                theme: '#23ade5',
                plugins: [
                    artplayerPlaylist({
                        rebuildPlayer: false,
                        onchanged: async (art, index) => {
                            updateParams(episodeList[index])
                            var sub = artplayerPluginMultipleSubtitles({
                                subtitles: episodeList[index].subtitles,
                            })
                            await sub(art)
                        },
                        autoNext: true,
                        showText: false,
                        playlist: episodeList,
                    }),
                    artplayerPluginMultipleSubtitles({
                        subtitles: episodeList[initialIndex].subtitles,
                    })
                ],
                customType: {
                    m3u8: playM3u8,
                    json: playJson
                },
            });


            // ── Ghi tiến độ xem ──
            // 30s/lần khi đang phát; pause / hết tập / ẩn tab / đóng tab ghi
            // phát cuối. user-history giữ max tiến độ nên ghi dồn không lùi mốc.
            setInterval(function () {
                if (art.playing && art.currentTime > 5) recordHistory(art.currentTime);
            }, 30000);
            art.on('video:pause', function () {
                if (art.currentTime > 5) recordHistory(art.currentTime);
            });
            // xem hết -> mốc cuối; link resume ở trang lịch sử thấy còn lại < 60s
            // sẽ KHÔNG kèm ?t= (mở lại từ đầu)
            art.on('video:ended', function () {
                recordHistory(art.duration || 0);
            });
            document.addEventListener('visibilitychange', function () {
                if (document.hidden && art.currentTime > 5) recordHistory(art.currentTime, true);
            });
            document.addEventListener('pagehide', function () {
                if (art.currentTime > 5) recordHistory(art.currentTime, true);
            });

            // ── Điều khiển lock screen iOS (MediaSession) ──
            // ⏮/⏭ đổi tập bằng cách CLICK ĐÚNG ITEM panel playlist của
            // plugin (cùng đường với nút prev/next trong control bar): plugin
            // tự giữ currentEp + chạy onchanged -> updateParams, lịch sử,
            // subtitle đều đồng bộ. Filter :not(.art-season-ep) loại item các
            // mùa khác được inject (click item mùa khác = điều hướng trang,
            // không phải đổi tập trong mùa).
            // play/pause điều khiển trực tiếp; setPositionState đưa thanh
            // tiến độ lên lock screen — OS tự đếm vị trí theo playbackRate,
            // gọi lại ở các mốc thay đổi; kéo thanh phát seekto về đây.
            // setPositionState throw TypeError khi duration NaN/0 (đầu tập,
            // m3u8 chưa có meta) -> bọc try/catch. Từng handler một try/catch:
            // iOS thiếu action nào thì bỏ action đó, không cụng cả cụm.
            if ('mediaSession' in navigator) {
                var epItems = function () {
                    return art.controls.playlist
                        ? art.controls.playlist.querySelectorAll('.art-selector-item:not(.art-season-ep)')
                        : [];
                };
                var jump = function (step) {
                    var i = M[currentEpisode ? currentEpisode.id : undefined];
                    if (i === undefined) return;
                    var item = epItems()[i + step];
                    if (item) item.click();
                };
                var updatePositionState = function () {
                    try {
                        navigator.mediaSession.setPositionState({
                            duration: art.duration,
                            playbackRate: art.playbackRate,
                            position: art.currentTime,
                        });
                    } catch (e) { /* duration chưa có -> bỏ qua */ }
                };
                var safeHandler = function (action, fn) {
                    try { navigator.mediaSession.setActionHandler(action, fn); } catch (e) { }
                };
                safeHandler('play', function () { art.play(); });
                safeHandler('pause', function () { art.pause(); });
                safeHandler('previoustrack', function () { jump(-1); });
                safeHandler('nexttrack', function () { jump(1); });
                // KHÔNG set seekforward/seekbackward: iOS lock screen ưu tiên
                // hiện 2 nút "tua ±N giây" chiếm hết 2 slot cạnh play/pause
                // (test user: chỉ thấy tua 10s, ⏮/⏭ biến mất). Bỏ 2 handler
                // này để iOS hiện nút tập trước/sau; vẫn còn seekto + thanh
                // tiến độ kéo được nên không mất khả năng tua.
                safeHandler('seekto', function (d) {
                    if (d && d.seekTime != null && isFinite(d.seekTime)) art.currentTime = d.seekTime;
                    updatePositionState();
                });
                ['video:loadedmetadata', 'video:seeked', 'video:ratechange', 'video:timeupdate']
                    .forEach(function (ev) { art.on(ev, updatePositionState); });
                // playbackState cho OS biết đang phát/dừng (icon trạng thái)
                var msState = function (s) {
                    try { navigator.mediaSession.playbackState = s; } catch (e) { }
                };
                art.on('video:play', function () { msState('playing'); });
                art.on('video:playing', function () { msState('playing'); });
                art.on('video:pause', function () { msState('paused'); });
                art.on('video:ended', function () { msState('paused'); });
            }

            // Cụm bên phải control bar: chỉ còn logo r3mina (select mùa đã
            // chuyển vào dropdown danh sách tập, xem phần seasonSelector
            // phía dưới). index là key chèn theo vị trí (so >= với index
            // phần tử có sẵn; core dùng 30/40/70, plugin 9) — KHÔNG dùng 0:
            // `e.index || this.id` nuốt giá trị falsy.
            // Nút logo r3mina -> về trang chủ (như nút logo của jwplayer)
            art.controls.add({
                name: 'r3mina',
                position: 'right',
                index: 1,
                html: '<img src="/anime/image/r3_player.png" alt="r3mina" style="height: 26px; width: 26px;">',
                tooltip: 'r3mina',
                click: function () {
                    window.location.href = '/anime'
                },
            });

            // Nút "Xem chung": bấm lần đầu -> tạo phòng + hiện link share; các
            // lần sau -> hiện lại link phòng đang mở (phòng bám tập đang xem,
            // đổi tập qua playlist thì phòng đổi theo)
            art.controls.add({
                name: 'room',
                position: 'right',
                index: 2,
                html: '<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>',
                tooltip: 'Xem chung',
                click: function () {
                    if (roomCode) {
                        prompt('Link phòng xem chung — copy gửi bạn bè:', roomLink());
                    } else {
                        createRoom();
                    }
                },
            });

            // ── Phát điều khiển của host vào room node ──
            // Chỉ ghi khi state thay đổi (play/pause/seek/hết tập), không ghi
            // timeupdate liên tục: người xem tự ngoại suy pos + (now - updatedAt)
            // giữa 2 lần ghi nên vẫn bám sát mà không spam Firebase.
            ['video:play', 'video:pause', 'video:seeked', 'video:ended'].forEach(function (ev) {
                art.on(ev, function () {
                    roomPatch({ pos: (art.currentTime || 0), playing: !!art.playing });
                });
            });

            // ── Chat phòng xem chung dạng SIDEBAR (RoomChat dùng chung
            // room/chat.js) ── Nút 💬 góc phải trên chỉ hiện sau khi tạo
            // phòng; bấm để mở/đóng cột chat cạnh video. Mount NGAY tại đây:
            // setupPlayer chạy sau fetch async, có thể muộn hơn event load
            // nên đăng ký listener load là bỏ trống. chat.js là defer script
            // -> chắc chắn đã load trước DOMContentLoaded.
            if (typeof RoomChat !== 'undefined') {
                var chatPanel = document.getElementById('chat-panel');
                var chatBtn = document.getElementById('chat-toggle');
                var chatLayout = document.getElementById('room-layout');
                if (chatPanel && chatBtn && chatLayout) {
                    RoomChat.mount(chatPanel, function () { return roomCode; });
                    chatBtn.addEventListener('click', function () {
                        if (!roomCode) {
                            art.notice.show = 'Tạo phòng xem chung (nút 👥) trước rồi chat với cả phòng';
                            return;
                        }
                        var on = chatLayout.classList.toggle('chat-open');
                        chatBtn.classList.toggle('active', on);
                        // video vừa co/giãn theo container -> bảo artplayer tính lại
                        setTimeout(function () { try { art.resize(); } catch (e) { } }, 60);
                    });
                }
            }

            // Gộp danh sách tập của TẤT CẢ các mùa vào chung panel playlist:
            // plugin render sẵn tập mùa hiện tại; các mùa còn lại (header
            // "Mùa N" + item tập) inject thêm vào .art-selector-list. Bấm tập
            // mùa khác = điều hướng sang URL player của mùa đó kèm ?e=<tập>
            // (node Firebase / slug kkphim riêng nên tiến độ xem giữ nguyên).
            // Chỉ làm khi bộ có >= 2 mùa.
            seasonSelector(getUrlParameter('id'), getUrlParameter('k')).then(seasons => {
                // Sheet về xong: nếu dòng tương ứng có poster (cột image) mà
                // artwork đang là logo đối chữa (poster tập bị chặn) -> probe
                // lại với nguồn mới (poster AniList CDN / phimimg)
                if (sheetImage) updateArtwork(currentEpisode);
                if (!seasons || seasons.length < 2) return;
                var list = art.controls.playlist.querySelector('.art-selector-list');
                if (!list) return;

                var curIdx = 0;
                seasons.forEach((s, i) => { if (s.current) curIdx = i });

                Promise.all(seasons.map(s => {
                    if (s.current) return Promise.resolve(null);
                    return fetchSeasonEpisodes(s).catch(() => []);
                })).then(results => {
                    // Khối item của plugin nằm liền nhau: các mùa TRƯỚC mùa
                    // hiện tại chèn trước khối (trướcRef là item đầu tiên),
                    // các mùa sau nối vào cuối panel.
                    var beforeRef = list.querySelector('.art-selector-item');
                    seasons.forEach((s, i) => {
                        var after = i > curIdx;
                        var header = document.createElement('div');
                        header.className = 'art-season-header';
                        header.textContent = s.label;
                        list.insertBefore(header, after ? null : beforeRef);
                        (results[i] || []).forEach(ep => {
                            var item = document.createElement('div');
                            item.className = 'art-selector-item art-season-ep';
                            // cùng quy ước hiển thị với item của plugin: key
                            // Firebase thay '.' bằng '_', hậu tố END mọi biến thể
                            // ('2_END', '2.end', '2.End', '2 END', '2-End') hiện
                            // trần số; yêu cầu dấu ngăn trước END để không nuốt
                            // từ thường chứa 'end' (vd 'legend')
                            item.textContent = String(ep.id).replace(/_/g, '.')
                                .replace(/[\s._-]+end\s*$/i, '').trim();
                            item.title = ep.title || '';
                            item.style.textAlign = 'left';
                            item.addEventListener('click', ev => {
                                ev.stopPropagation();
                                window.location.href = s.url + '&e=' + encodeURIComponent(ep.id);
                            });
                            list.insertBefore(item, after ? null : beforeRef);
                        });
                    });
                });
            });

            // ?t=<giây> seek tới mốc trong tập (chia sẻ link đang xem dở).
            // Chỉ áp cho tập mở ban đầu; autoPlayback cũng seek trên 'ready'
            // nhưng đăng ký trước nên listener này chạy sau và thắng.
            var t = parseFloat(getUrlParameter('t'));
            if (Number.isFinite(t) && t > 0) {
                art.on('ready', function () { art.currentTime = t; });
            }

            if (episodeList[initialIndex].subtitles) {
                art.setting.add({
                    width: 200,
                    html: 'Subtitle',
                    tooltip: 'Double',
                    icon: '<img width="22" heigth="22" src="subtitle.svg">',
                    selector: [
                        {
                            html: 'Display',
                            tooltip: 'Show',
                            switch: true,
                            onSwitch: function (item) {
                                item.tooltip = item.switch ? 'Hide' : 'Show';
                                art.subtitle.show = !item.switch;
                                return !item.switch;
                            },
                        },
                        {
                            html: 'Reverse',
                            tooltip: 'Off',
                            switch: false,
                            onSwitch: function (item) {
                                item.tooltip = item.switch ? 'Off' : 'On';
                                if (item.switch) {
                                    art.plugins.multipleSubtitles.tracks(['vietnamese', 'english']);
                                } else {
                                    art.plugins.multipleSubtitles.tracks(['english', 'vietnamese']);

                                }
                                return !item.switch;
                            },
                        },
                        {
                            default: true,
                            html: 'Double',
                            name: 'double',
                        },
                        {
                            html: 'Vietnamese',
                            name: 'vietnamese',
                        },
                        {
                            html: 'English',
                            name: 'english',
                        }
                    ],
                    onSelect: function (item) {
                        if (item.name === 'double') {
                            art.plugins.multipleSubtitles.reset();
                        } else {
                            art.plugins.multipleSubtitles.tracks([item.name]);
                        }
                        return item.html;
                    },
                })
            }
        }


        const style = `
.art-subtitle-line:has(.art-subtitle-english) {
	color: yellow;
}
`;

        const $style = document.getElementById('artplayer-subtitle-style');
        if ($style) {
            $style.textContent = style;
        } else {
            const $style = document.createElement('style');
            $style.id = 'artplayer-subtitle-style';
            $style.textContent = style;
            document.head.appendChild($style);
        }
    </script>
