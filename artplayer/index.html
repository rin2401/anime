<html>

<head>
    <title>ArtPlayer</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="apple-touch-icon" href="/anime/image/r3_512.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Anime">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a1a1a">
    <link rel="manifest" href="/anime/manifest.json">
    <link rel="icon" type="image/png" href="/anime/image/r3_512.png">
    <meta property="og:image" content="/anime/image/r3.png">

    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <link rel="preconnect" href="https://phimapi.com">
    <link rel="preconnect" href="https://r3fire.firebaseio.com">

    <!-- defer: không chặn render, vẫn giữ đúng thứ tự; code khởi động chạy sau DOMContentLoaded -->
    <script defer src="https://cdn.jsdelivr.net/npm/hls.js@1.6.16/dist/hls.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/artplayer@5.4.0/dist/artplayer.js"></script>
    <script defer
        src="https://cdn.jsdelivr.net/npm/artplayer-plugin-hls-control@1.1.0/dist/artplayer-plugin-hls-control.js"></script>
    <script defer src="artplayer-plugin-playlist.browser.js"></script>
    <script defer
        src="https://cdn.jsdelivr.net/npm/artplayer-plugin-multiple-subtitles@1.1.0/dist/artplayer-plugin-multiple-subtitles.min.js"></script>
    <style>
        html,
        body {
            margin-left: 0;
            margin-top: 0;
            width: 100vw;
            overflow: hidden;
            background-color: black;
        }

        .art-video-player {
            --art-padding: 0 !important;
        }

        /* Panel playlist dạng lưới: các tập là ô nút đều nhau, 5 ô mỗi hàng
           (grid 5 cột), header mùa in đậm chiếm trọn 1 hàng để tách nhóm.
           Panel .art-selector-list absolute cần width tường minh; neo phải để
           không tràn mép player. !important thắng CSS artplayer chèn SAU
           <style> trang. Grid không hỗ trợ (TV rất cũ) thì panel tự rơi về
           danh sách dọc của artplayer — không vỡ layout. */
        .art-control-selector .art-selector-list {
            display: grid !important;
            grid-template-columns: repeat(5, 1fr) !important;
            gap: 6px !important;
            width: 240px !important;
            padding: 8px !important;
            box-sizing: border-box !important;
            left: auto !important;
            right: 0 !important;
        }

        .art-control-selector .art-selector-list .art-selector-item {
            width: auto !important;
            min-width: 0 !important;
            padding: 5px 0 !important;
            margin: 0 !important;
            text-align: center !important;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }

        .art-selector-list .art-season-header {
            grid-column: 1 / -1 !important;
            padding: 8px 0 2px !important;
            font-weight: 700;
            color: #e5e7eb;
            font-size: 13px;
            text-align: left;
        }

        /* Mobile hẹp: ẩn nút logo r3mina — control bar stock không đủ chỗ cho
           hết cụm nút phải, logo chiếm ~56px không thiết yếu trên điện thoại
           (desktop vẫn hiện). */
        @media (max-width: 700px) {
            .art-control-r3mina {
                display: none !important;
            }
        }

    </style>
</head>

<body>
    <div class="artplayer-app"></div>

    <script>
        function getUrlParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        // Nhớ tập đang xem theo từng bộ (?id= hoặc ?k=). Link từ trang chủ không
        // kèm ?e nên nếu không lưu thì lần nào mở lại cũng nhảy về tập mới nhất.
        function getEpStoreKey() {
            const id = getUrlParameter('id');
            if (id) return 'artplayer:ep:id:' + id;
            const k = getUrlParameter('k');
            if (k) return 'artplayer:ep:k:' + k;
            return '';
        }

        // localStorage có thể ném lỗi (private mode, TV cũ chặn storage) -> bọc try
        function saveLastEp(id) {
            const key = getEpStoreKey();
            if (!key) return;
            try { localStorage.setItem(key, String(id)); } catch (e) { }
        }

        function loadLastEp() {
            const key = getEpStoreKey();
            if (!key) return null;
            try { return localStorage.getItem(key); } catch (e) { return null; }
        }

        // Token chặn race: đổi tập liên tiếp thì probe của tập cũ trả sau không
        // được ghi đè artwork của tập đang phát
        var _msToken = 0;
        // Poster của bộ đọc từ Sheet (cột image — AniList CDN cho anime,
        // phimimg cho kkphim); có muộn hơn lần set artwork đầu (Sheet fetch
        // async) -> updateArtwork được gọi lại khi Sheet về
        var sheetImage = '';
        var currentEpisode = null;

        function updateParams(episode) {
            const url = new URL(window.location.href);
            url.searchParams.set('e', episode.id);
            window.history.replaceState({}, '', url);
            document.title = episode.title
            saveLastEp(episode.id)
            currentEpisode = episode;
            updateArtwork(episode);
        }

        function updateArtwork(episode) {
            if (!episode || !('mediaSession' in navigator)) return;
            // Poster của tập (AVS/kkphim) hay bị chặn hotlink / 404 /
            // mixed-content, hoặc CDN nguồn bị media daemon của iOS
            // (lock screen) fetch không được dù WebKit trong trang load
            // được -> iOS hiện ô xám rỗng. Khai sizes LỆCH kích thước
            // thật (vd 512x512 cho ảnh 4K) iOS cũng từ chối hiện. Probe
            // lần lượt: ảnh qua Photon CDN (re-encode JPEG chuẩn) -> ảnh
            // gốc -> logo web (same-origin, chắc chắn hiện).
            var token = ++_msToken;
                // Debug lock screen iOS: &msart=logo -> CHỈ entry logo
                // same-origin; &msart=square -> CHỈ 1 entry poster Photon
                // crop vuông 512x512; &msart=pad -> CHỈ 1 entry letterbox
                // data URL. Đúng 1 entry, không phụ gia.
                var msArt = getUrlParameter('msart');
                var debugRaw = msArt === 'logo' || msArt === 'square' || msArt === 'pad';
            // Ảnh CDN nguồn có khi daemon của iOS không fetch được -> lấy
            // qua Photon (trang chủ đã dùng cho grid, ổn định). Ảnh same-
            // origin giữ nguyên. dim -> crop vuông chính xác (resize=).
            var artworkSrc = function (src, dim) {
                if (!src || src.indexOf('http') !== 0 || src.indexOf(location.origin) === 0) return src;
                var q = dim ? 'resize=' + dim + ',' + dim : 'w=720';
                return 'https://i0.wp.com/' + src.replace(/^https?:\/\//, '') + '?' + q + '&ssl=1';
            };
            var setArtwork = function (src, w, h) {
                if (token !== _msToken) return;
                var type = /\.png($|\?)/i.test(src) ? 'image/png' : 'image/jpeg';
                // Ảnh nguồn nhỏ (poster ~100px) khai đúng size nhỏ thì iOS
                // lock screen TỪ CHỐI hiện (ô xám) — ảnh to vẫn chạy vì
                // entry to có sẵn. Khai thêm entry 512x512 cùng src để iOS
                // tự scale ảnh nhỏ lên (thừa với logo r3_512).
                var artwork = [{ src: src, sizes: w + 'x' + h, type: type }];
                if (!debugRaw) {
                    if (w !== 512 || h !== 512)
                        artwork.push({ src: src, sizes: '512x512', type: type });
                    if (src !== imageUrl) {
                        // Logo same-origin đứng CUỐI: nếu mọi entry ảnh phim
                        // daemon không fetch được thì còn hiện logo thay ô xám
                        artwork.push({ src: imageUrl, sizes: '512x512', type: 'image/png' });
                    }
                }
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: episode.title,
                    artwork: artwork,
                });
            };
            var probeArtwork = function (srcs) {
                if (!srcs.length) return;
                var src = srcs[0];
                var img = new Image();
                img.onload = function () {
                    if (token !== _msToken) return;
                    // Ảnh degenerate không có kích thước nội tại -> đừng khai 0x0
                    var w = img.naturalWidth || 512;
                    var h = img.naturalHeight || w;
                    setArtwork(src, w, h);
                };
                img.onerror = function () {
                    if (token !== _msToken) return;
                    probeArtwork(srcs.slice(1));
                };
                img.src = src;
            };
            // Letterbox 512x512: vẽ poster nguyên vẹn giữa canvas trong suốt
            // (không cắt đầu/chân như crop vuông) -> data URL PNG. Ảnh nguồn
            // lấy qua Photon (ACAO *) nên canvas không bị taint.
            var padSquare = function (src, done) {
                if (!src || src.indexOf('http') !== 0) { done(null); return; }
                var img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = function () {
                    if (token !== _msToken) return;
                    try {
                        var cv = document.createElement('canvas');
                        cv.width = 512; cv.height = 512;
                        var ctx = cv.getContext('2d');
                        var s = Math.min(512 / img.naturalWidth, 512 / img.naturalHeight) || 1;
                        var w = Math.max(1, Math.round(img.naturalWidth * s));
                        var h = Math.max(1, Math.round(img.naturalHeight * s));
                        ctx.drawImage(img, (512 - w) / 2, (512 - h) / 2, w, h);
                        done(cv.toDataURL('image/png'));
                    } catch (e) { done(null); }
                };
                img.onerror = function () {
                    if (token === _msToken) done(null);
                };
                img.src = src;
            };
            var srcs;
            if (msArt === 'logo') {
                srcs = [imageUrl];
            } else if (msArt === 'square') {
                srcs = [artworkSrc(episode.image, 512)];
            } else if (msArt === 'pad') {
                // Debug: CHỈ entry letterbox data URL
                padSquare(artworkSrc(sheetImage || episode.image), function (dataUrl) {
                    if (token !== _msToken || !dataUrl) return;
                    setArtwork(dataUrl, 512, 512);
                });
                return;
            } else {
                // Mặc định: letterbox data URL (poster nguyên vẹn) đứng đầu;
                // nếu iOS không render được data: thì còn entry vuông Photon
                // (đã xác nhận render) và logo đối chữa
                var best = sheetImage || episode.image;
                if (best) {
                    var fallbackEntries = [{ src: imageUrl, sizes: '512x512', type: 'image/png' }];
                    if (sheetImage) fallbackEntries.unshift({
                        src: artworkSrc(sheetImage, 512), sizes: '512x512',
                        type: /\.png($|\?)/i.test(sheetImage) ? 'image/png' : 'image/jpeg'
                    });
                    if (episode.image && episode.image !== sheetImage && episode.image !== imageUrl) fallbackEntries.unshift({
                        src: artworkSrc(episode.image, 512), sizes: '512x512',
                        type: /\.png($|\?)/i.test(episode.image) ? 'image/png' : 'image/jpeg'
                    });
                    padSquare(artworkSrc(best), function (dataUrl) {
                        if (token !== _msToken) return;
                        if (dataUrl) fallbackEntries.unshift({ src: dataUrl, sizes: '512x512', type: 'image/png' });
                        navigator.mediaSession.metadata = new MediaMetadata({
                            title: episode.title,
                            artwork: fallbackEntries,
                        });
                    });
                    return;
                }
                srcs = [imageUrl];
            }
            probeArtwork(srcs.filter(Boolean));
        }
        function createBlobUrl(data, mimeType = "application/vnd.apple.mpegurl") {
            const blob = new Blob([data], { type: mimeType });
            return URL.createObjectURL(blob);
        }

        function createBase64Url(data, mimeType = "application/vnd.apple.mpegurl") {
            return `data:${mimeType};base64,${btoa(data)}`;
        }

        function removeAds(m3u8, url) {
            var baseUrl = url.split("/").slice(0, -1).join("/") + "/"
            m3u8 = m3u8.replace(/#EXT-X-DISCONTINUITY.*?#EXT-X-DISCONTINUITY\n/sg, "#EXT-X-DISCONTINUITY\n");
            m3u8 = m3u8.replace(/(?:#EXT-X-DISCONTINUITY\n)+/g, "#EXT-X-DISCONTINUITY\n");

            m3u8 = m3u8.split('\n').map(line => {
                if (line.startsWith('#') || line.trim() === '') {
                    return line;
                }

                if (!line.match(/^https?:\/\//i)) {
                    return baseUrl + line;
                }

                return line;
            }).join('\n');

            return m3u8
        }

        // Config cho thiết bị yếu (smart TV ít RAM, mạng chậm):
        // - capLevelToPlayerSize: không tải quality cao hơn kích thước player
        // - buffer nhỏ + giải phóng phần đã xem để không phình RAM khi xem tập dài
        // - abrEwmaDefaultEstimate: khởi động ~1Mbps, tránh chọn nhầm quality cao khi mạng yếu
        var TV_HLS_CONFIG = {
            capLevelToPlayerSize: true,
            maxBufferLength: 20,
            maxBufferSize: 20 * 1000 * 1000,
            backBufferLength: 30,
            abrEwmaDefaultEstimate: 1000000,
        };

        // Loader lọc quảng cáo trên từng playlist thay vì tải trước rồi ép 1 quality:
        // giữ nguyên master playlist cho hls.js tự chọn level theo băng thông (ABR).
        var _adsFilterLoader = null;
        function getAdsFilterLoader() {
            if (!_adsFilterLoader) {
                _adsFilterLoader = class extends Hls.DefaultConfig.loader {
                    load(context, config, callbacks) {
                        if (context.type === 'manifest' || context.type === 'level') {
                            const onSuccess = callbacks.onSuccess;
                            callbacks.onSuccess = function (response, stats, ctx, networkDetails) {
                                if (typeof response.data === 'string' && response.data.indexOf('#EXTINF') !== -1) {
                                    response.data = removeAds(response.data, ctx.url);
                                }
                                onSuccess(response, stats, ctx, networkDetails);
                            };
                        }
                        super.load(context, config, callbacks);
                    }
                };
            }
            return _adsFilterLoader;
        }

        function playM3u8Text(video, m3u8, art) {
            if (Hls.isSupported()) {
                if (art.hls) art.hls.destroy();
                const hls = new Hls(TV_HLS_CONFIG);
                var blob = createBlobUrl(m3u8)
                hls.loadSource(blob);
                hls.attachMedia(video);
                art.hls = hls;
                art.on('destroy', () => hls.destroy());
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = createBase64Url(m3u8);
            }
        }

        async function playM3u8(video, url, art) {
            if (Hls.isSupported()) {
                if (art.hls) art.hls.destroy();
                const hls = new Hls(Object.assign({ loader: getAdsFilterLoader() }, TV_HLS_CONFIG));
                hls.loadSource(url);
                hls.attachMedia(video);
                art.hls = hls;
                art.on('destroy', () => hls.destroy());
                return;
            }

            // Safari native HLS: không can thiệp được request nên tải playlist,
            // lọc quảng cáo rồi phát qua data URL như trước
            var res = await fetch(url)
            if (!res.ok) {
                console.error(res);
                return
            }
            var m3u8 = await res.text()
            const regex = /.*?\.m3u8/gi;
            const links = m3u8.match(regex);
            if (links) {
                url = url.split("/").slice(0, -1).join("/") + "/" + links[0]
                res = await fetch(url)
                if (!res.ok) {
                    console.error(res);
                    return
                }
                m3u8 = await res.text()
            }

            m3u8 = removeAds(m3u8, url)
            if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = createBase64Url(m3u8);
            }
        }

        async function playJson(video, url, art) {
            res = await fetch(url)
            if (!res.ok) {
                console.error(res);
                return
            }
            var data = await res.json()
            var m3u8 = data.m3u8
            playM3u8Text(video, m3u8, art)
        }

        var imageUrl = "/anime/image/r3_512.png"

        // ── Đổi mùa trong player ──
        // Sheet catalog (bản published gviz, như trang chủ) là nguồn group:
        // các dòng cùng giá trị cột `series` là các mùa của một bộ. Mở player
        // bằng ?id= (playlist/gdrive/anilist id) hoặc ?k= (slug kkphim) → tìm
        // dòng tương ứng → các dòng cùng series thành mục "Mùa" trong setting
        // panel; chọn mùa = điều hướng sang URL player của mùa đó (mỗi mùa vẫn
        // là node Firebase / slug kkphim riêng nên tiến độ xem giữ nguyên).
        const SHEET_ID = '12q04f4hwtVQjfVSUayDsgXLGGbqrl9urm8gp556nPQA';
        const SHEET_GID = "1193967919";

        function playerUrlFromRow(row) {
            if (row.playlist) return '/anime/artplayer/?id=' + row.playlist;
            if (row.anilist_id) return '/anime/artplayer/?id=' + row.anilist_id;
            if (row.phimapi) return '/anime/artplayer/?k=' + row.phimapi;
            if (row.gdrive) return '/anime/artplayer/?id=' + row.gdrive;
            return '';
        }

        function fetchSheetRows() {
            var url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&tq&gid=${SHEET_GID}`;
            return fetch(url).then(res => res.text()).then(txt => {
                // Không dùng regex lookbehind: trình duyệt TV cũ (Chrome < 62)
                // SyntaxError ngay lúc parse script -> trắng trang
                var jsonString = txt.substring(txt.indexOf('"table":') + '"table":'.length, txt.lastIndexOf('});'))
                var data = JSON.parse(jsonString)
                var cols = data.cols.map(col => col.label)
                return data.rows.map(r => {
                    var row = {}
                    cols.map((col, i) => {
                        var cel = r.c[i]
                        row[col] = cel ? (cel.f ? cel.f : cel.v) : ''
                    })
                    return row
                })
            })
        }

        // Promise -> danh sách mùa [{url, label, current}] của bộ đang mở,
        // đã sort theo (year, name); [] khi bộ 1 mùa / không có trong Sheet.
        function seasonSelector(id, k) {
            return fetchSheetRows().then(rows => {
                var rid = String(id || '');
                var match = null;
                rows.map(row => {
                    if (rid && (String(row.playlist) == rid || String(row.gdrive) == rid
                        || String(row.anilist_id) == rid)) {
                        match = row;
                    } else if (!rid && k && String(row.phimapi) == String(k)) {
                        match = row;
                    }
                });
                // fallback cuối: ?id= trỏ thẳng cột id (không qua playlist)
                if (!match && rid) {
                    rows.map(row => { if (String(row.id) == rid) match = row });
                }
                // Poster của bộ từ cột image Sheet (AniList CDN cho anime,
                // phimimg cho kkphim) — nguồn artwork lock screen ổn định
                if (match) sheetImage = String(match.image || '').trim();
                if (!match) return [];

                var series = String(match.series || '').trim();
                if (!series) return [];

                var members = rows.filter(row => String(row.series || '').trim() == series)
                    .sort((a, b) => {
                        var ya = parseInt(a.year) || 0, yb = parseInt(b.year) || 0;
                        if (ya != yb) return ya - yb;
                        return String(a.name || '').localeCompare(String(b.name || ''));
                    });
                return members.map((m, i) => ({
                    url: playerUrlFromRow(m),
                    label: 'Mùa ' + (i + 1),
                    current: m === match,
                }));
            }).catch(err => {
                console.error(err);
                return [];
            })
        }

        // Danh sách tập của một mùa khác trong cùng series: parse query từ URL
        // player của mùa đó (?id= node Firebase hoặc ?k= slug kkphim) rồi map
        // giống hệt luồng chính — để ?e= trên URL đích khớp M[] của player mùa đó.
        function fetchSeasonEpisodes(season) {
            var q = new URLSearchParams(season.url.split('?')[1] || '');
            var pid = q.get('id');
            if (pid) {
                return fetch(`https://r3fire.firebaseio.com/anime/${pid}.json`)
                    .then(res => res.json())
                    .then(data => mapEpisodes(data, pid));
            }
            var k = q.get('k');
            if (k) {
                return fetch('https://phimapi.com/phim/' + k)
                    .then(res => res.json())
                    .then(data => mapEpisodes(kkphimEpisodes(data)));
            }
            return Promise.resolve([]);
        }


        // Chờ DOMContentLoaded: các lib (hls.js, artplayer...) load bằng defer nên chỉ
        // chắc chắn sẵn sàng từ thời điểm này; fetch nhanh có thể về trước khi lib load xong
        document.addEventListener('DOMContentLoaded', function () {
            const id = getUrlParameter('id')
            const k = getUrlParameter('k')

            if (id) {
                const url = `https://r3fire.firebaseio.com/anime/${id}.json`
                fetch(url).then(response => response.json()).then(data => setupPlayer(data, id))
            } else if (k) {
                const url = "https://phimapi.com/phim/" + k
                fetch(url).then(response => response.json())
                    .then(data => setupPlayer(kkphimEpisodes(data)))
            }
        });

        // kkphim trả tập đúng thứ tự phát sóng, lastNum/extra bám theo đó.
        function kkphimEpisodes(data) {
            var lastNum = 0, extra = 0;
            return data.episodes[0].server_data.map((item) => {
                // Lấy số tập từ TÊN trước ('Tập 1004.5' -> 1004.5): kkphim bỏ
                // dấu chấm trong slug (tap-10045) nên slug 5 chữ số parse thành
                // 10045, các tập .5 rơi xuống cuối danh sách. Tên luôn ghi đúng
                // nhãn; chỉ về slug khi tên không có số.
                // slug 'tap-07' -> 7; 'full' (phim lẻ) -> 1. Slug không mang số
                // ('tap-sp' = OAD chèn giữa mùa, vd Attack on Titan phần 4) lấy
                // id thập phân ngay sau tập có số gần nhất: SP giữa 16 và 17
                // -> 16.5. epNum() vốn hiểu số lẻ nên nó tự nằm đúng chỗ.
                // Trước đây id rơi về 1 mặc định -> đụng tập 1: playlist hiện
                // 2 mục "- 1" và ?e=1 phát nhầm SP.
                // extra/100 phòng bộ có nhiều tập đặc biệt liên tiếp (16.5, 16.51).
                var slug = item.slug || ''
                var id = 1
                var nm = (item.name || '').match(/(\d+(?:\.\d+)?)/)
                if (nm) {
                    id = parseFloat(nm[1]); lastNum = id; extra = 0
                } else if (slug.indexOf("tap-") === 0) {
                    let rest = slug.slice(4);
                    let num = Number(rest);
                    if (Number.isInteger(num)) {
                        id = num; lastNum = num; extra = 0
                    } else {
                        id = lastNum + 0.5 + extra / 100; extra++
                    }
                }

                return {
                    id: id,
                    title: data.movie.origin_name + " - " + id,
                    file: item.link_m3u8,
                    // poster dọc trước — thumb_url nhiều bộ là ảnh 4K ngang
                    // (3840x2160) mà lock screen iOS không render nổi
                    image: data.movie.poster_url || data.movie.thumb_url || imageUrl,
                }
            })
        }



        // Số tập để sắp xếp: '7.5' -> 7.5, '07_5' -> 7.5 (key Firebase thay '.' bằng '_'),
        // tập không đánh số ('Xem Full', 'Special 6') -> 0, xếp lên đầu.
        function epNum(id) {
            return parseFloat(String(id).replace(/_/g, '.')) || 0;
        }

        // Map node Firebase HOẶC mảng kkphim (cả hai có dạng {id, title,
        // file/m3u8, image}) thành danh sách tập có `url` phát được. Duyệt bằng
        // Object.entries để dùng chung cho cả object lẫn array. animeId: key
        // Firebase của bộ đang mở (?id=). Cần cho các tập lưu THẲNG nội dung
        // m3u8 trong node (phim lẻ Ghibli/Shinkai...) thay vì có sẵn `file`.
        function mapEpisodes(data, animeId) {
            var episodeList = [];

            // node không tồn tại -> Firebase trả null
            data = data || {}

            Object.entries(data).forEach(([id, episode]) => {
                if (!episode) {
                    return
                }

                // Chỉ nhận tập CÓ nguồn phát. Cùng một node còn chứa tập chỉ có
                // drive_id (do crawler Drive đẩy lên); đưa vào playlist thì url undefined.
                if (!episode.file && !episode.m3u8) {
                    return
                }

                // Tập kiểu cũ chỉ có `m3u8` (nội dung playlist, không phải link):
                // trỏ về chính node đó trên Firebase để customType `json` (playJson)
                // tải rồi phát. Không nhân bản dữ liệu sang node mới.
                var file = episode.file ||
                    `https://r3fire.firebaseio.com/anime/${animeId}/${id}.json`

                id = episode.id || id
                episodeList.push({
                    id: id,
                    title: episode.title,
                    url: file,
                    image: episode.image || imageUrl,
                    subtitles: episode.subtitles,
                });
            });

            // Sắp xếp tăng dần theo số tập. Không tin thứ tự Object.entries: JS xếp
            // key số nguyên ('1'..'12') trước mọi key chữ, nên tập lẻ lưu dạng '07_5'
            // (Firebase không cho dấu '.' trong key) bị rơi xuống cuối danh sách.
            episodeList.sort(function (a, b) { return epNum(a.id) - epNum(b.id) });
            return episodeList;
        }

        function setupPlayer(data, animeId) {
            var M = {};

            var episodeList = mapEpisodes(data, animeId);
            episodeList.forEach(function (ep, i) { M[ep.id] = i });

            if (!episodeList.length) {
                // Bộ chỉ có drive_id (crawler Drive), chưa crawl m3u8 -> chuyển
                // sang player Drive cùng bộ thay vì đứng ở màn hình đen.
                if (animeId) {
                    window.location.href = '/anime/gdrive/?id=' + animeId
                    return
                }
                console.error('Không có tập nào có m3u8 để phát.');
                return
            }
            // ?e trên URL ưu tiên nhất; không có thì lấy tập đã xem dở đã lưu
            var e = getUrlParameter('e');
            if (e === null) e = loadLastEp();
            e = String(e);
            // không dùng ?? : trình duyệt TV cũ (Chrome < 80) fail ngay lúc parse
            // chưa xem (?e= không có, không có tập đã lưu) -> mặc định TẬP 1
            var initialIndex = (M[e] !== undefined) ? M[e] : 0;

            updateParams(episodeList[initialIndex])

            // Chạm giữa màn hình trên MOBILE = play/pause: artplayer mặc định
            // tắt MOBILE_CLICK_PLAY nên tap không làm gì (desktop không bị ảnh
            // hưởng — click giữa vẫn toggle sẵn, double-click fullscreen).
            Artplayer.MOBILE_CLICK_PLAY = true;

            var art = new Artplayer({
                container: '.artplayer-app',
                url: episodeList[initialIndex].url,
                poster: episodeList[initialIndex].image || imageUrl,
                setting: true,
                isLive: false,
                muted: false,
                autoplay: true,
                pip: true,
                // autoSize: true,
                autoMini: true,
                screenshot: false,
                setting: true,
                loop: true,
                flip: true,
                playbackRate: true,
                aspectRatio: true,
                fullscreen: true,
                fullscreenWeb: false,
                subtitleOffset: true,
                miniProgressBar: true,
                mutex: true,
                backdrop: true,
                playsInline: true,
                autoPlayback: true,
                // airplay: true,
                theme: '#23ade5',
                plugins: [
                    artplayerPlaylist({
                        rebuildPlayer: false,
                        onchanged: async (art, index) => {
                            updateParams(episodeList[index])
                            var sub = artplayerPluginMultipleSubtitles({
                                subtitles: episodeList[index].subtitles,
                            })
                            await sub(art)
                        },
                        autoNext: true,
                        showText: false,
                        playlist: episodeList,
                    }),
                    artplayerPluginMultipleSubtitles({
                        subtitles: episodeList[initialIndex].subtitles,
                    })
                ],
                customType: {
                    m3u8: playM3u8,
                    json: playJson
                },
            });


            // Cụm bên phải control bar: chỉ còn logo r3mina (select mùa đã
            // chuyển vào dropdown danh sách tập, xem phần seasonSelector
            // phía dưới). index là key chèn theo vị trí (so >= với index
            // phần tử có sẵn; core dùng 30/40/70, plugin 9) — KHÔNG dùng 0:
            // `e.index || this.id` nuốt giá trị falsy.
            // Nút logo r3mina -> về trang chủ (như nút logo của jwplayer)
            art.controls.add({
                name: 'r3mina',
                position: 'right',
                index: 1,
                html: '<img src="/anime/image/r3_player.png" alt="r3mina" style="height: 26px; width: 26px;">',
                tooltip: 'r3mina',
                click: function () {
                    window.location.href = '/anime'
                },
            });

            // Gộp danh sách tập của TẤT CẢ các mùa vào chung panel playlist:
            // plugin render sẵn tập mùa hiện tại; các mùa còn lại (header
            // "Mùa N" + item tập) inject thêm vào .art-selector-list. Bấm tập
            // mùa khác = điều hướng sang URL player của mùa đó kèm ?e=<tập>
            // (node Firebase / slug kkphim riêng nên tiến độ xem giữ nguyên).
            // Chỉ làm khi bộ có >= 2 mùa.
            seasonSelector(getUrlParameter('id'), getUrlParameter('k')).then(seasons => {
                // Sheet về xong: nếu dòng tương ứng có poster (cột image) mà
                // artwork đang là logo đối chữa (poster tập bị chặn) -> probe
                // lại với nguồn mới (poster AniList CDN / phimimg)
                if (sheetImage) updateArtwork(currentEpisode);
                if (!seasons || seasons.length < 2) return;
                var list = art.controls.playlist.querySelector('.art-selector-list');
                if (!list) return;

                var curIdx = 0;
                seasons.forEach((s, i) => { if (s.current) curIdx = i });

                Promise.all(seasons.map(s => {
                    if (s.current) return Promise.resolve(null);
                    return fetchSeasonEpisodes(s).catch(() => []);
                })).then(results => {
                    // Khối item của plugin nằm liền nhau: các mùa TRƯỚC mùa
                    // hiện tại chèn trước khối (trướcRef là item đầu tiên),
                    // các mùa sau nối vào cuối panel.
                    var beforeRef = list.querySelector('.art-selector-item');
                    seasons.forEach((s, i) => {
                        var after = i > curIdx;
                        var header = document.createElement('div');
                        header.className = 'art-season-header';
                        header.textContent = s.label;
                        list.insertBefore(header, after ? null : beforeRef);
                        (results[i] || []).forEach(ep => {
                            var item = document.createElement('div');
                            item.className = 'art-selector-item art-season-ep';
                            // cùng quy ước hiển thị với item của plugin: key
                            // Firebase thay '.' bằng '_', hậu tố END mọi biến thể
                            // ('2_END', '2.end', '2.End', '2 END', '2-End') hiện
                            // trần số; yêu cầu dấu ngăn trước END để không nuốt
                            // từ thường chứa 'end' (vd 'legend')
                            item.textContent = String(ep.id).replace(/_/g, '.')
                                .replace(/[\s._-]+end\s*$/i, '').trim();
                            item.title = ep.title || '';
                            item.style.textAlign = 'left';
                            item.addEventListener('click', ev => {
                                ev.stopPropagation();
                                window.location.href = s.url + '&e=' + encodeURIComponent(ep.id);
                            });
                            list.insertBefore(item, after ? null : beforeRef);
                        });
                    });
                });
            });

            // ?t=<giây> seek tới mốc trong tập (chia sẻ link đang xem dở).
            // Chỉ áp cho tập mở ban đầu; autoPlayback cũng seek trên 'ready'
            // nhưng đăng ký trước nên listener này chạy sau và thắng.
            var t = parseFloat(getUrlParameter('t'));
            if (Number.isFinite(t) && t > 0) {
                art.on('ready', function () { art.currentTime = t; });
            }

            if (episodeList[initialIndex].subtitles) {
                art.setting.add({
                    width: 200,
                    html: 'Subtitle',
                    tooltip: 'Double',
                    icon: '<img width="22" heigth="22" src="subtitle.svg">',
                    selector: [
                        {
                            html: 'Display',
                            tooltip: 'Show',
                            switch: true,
                            onSwitch: function (item) {
                                item.tooltip = item.switch ? 'Hide' : 'Show';
                                art.subtitle.show = !item.switch;
                                return !item.switch;
                            },
                        },
                        {
                            html: 'Reverse',
                            tooltip: 'Off',
                            switch: false,
                            onSwitch: function (item) {
                                item.tooltip = item.switch ? 'Off' : 'On';
                                if (item.switch) {
                                    art.plugins.multipleSubtitles.tracks(['vietnamese', 'english']);
                                } else {
                                    art.plugins.multipleSubtitles.tracks(['english', 'vietnamese']);

                                }
                                return !item.switch;
                            },
                        },
                        {
                            default: true,
                            html: 'Double',
                            name: 'double',
                        },
                        {
                            html: 'Vietnamese',
                            name: 'vietnamese',
                        },
                        {
                            html: 'English',
                            name: 'english',
                        }
                    ],
                    onSelect: function (item) {
                        if (item.name === 'double') {
                            art.plugins.multipleSubtitles.reset();
                        } else {
                            art.plugins.multipleSubtitles.tracks([item.name]);
                        }
                        return item.html;
                    },
                })
            }
        }


        const style = `
.art-subtitle-line:has(.art-subtitle-english) {
	color: yellow;
}
`;

        const $style = document.getElementById('artplayer-subtitle-style');
        if ($style) {
            $style.textContent = style;
        } else {
            const $style = document.createElement('style');
            $style.id = 'artplayer-subtitle-style';
            $style.textContent = style;
            document.head.appendChild($style);
        }
    </script>
